name: Inspect media share

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-firestorage.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Firestorage chunks and API
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://firestorage.ai'
          SHARE='https://firestorage.ai/ja/f/J-3ukq_XeNqc'
          curl -L --fail --silent --show-error "$SHARE" -o /tmp/share.html
          echo '--- page route chunk ---'
          ROUTE=$(grep -Eo '/_next/static/chunks/app/\(files\)/ja/f/page-[A-Za-z0-9]+\.js' /tmp/share.html | head -1)
          curl -L --fail --silent --show-error "$BASE$ROUTE" -o /tmp/route.js
          cat /tmp/route.js
          echo
          echo '--- downloading all referenced JS chunks ---'
          mkdir -p /tmp/chunks
          grep -Eo 'src="/_next/static/[^"]+\.js"' /tmp/share.html | sed 's/^src="//;s/"$//' | sort -u > /tmp/chunks.txt
          while IFS= read -r p; do
            f="/tmp/chunks/$(echo "$p" | tr '/()' '___')"
            curl -L --fail --silent --show-error "$BASE$p" -o "$f" || true
          done </tmp/chunks.txt
          cat /tmp/chunks/* > /tmp/all.js
          echo "combined bytes: $(wc -c </tmp/all.js)"
          echo '--- filenames ---'
          grep -oE '.{0,220}assets-[1-4]\.tar\.gz.{0,420}' /tmp/all.js | head -80 || true
          echo '--- API endpoints ---'
          grep -Eo '/api/[A-Za-z0-9_./?=&${}:%-]+' /tmp/all.js | sort -u | head -300 || true
          echo '--- relevant contexts ---'
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/all.js').read_text(errors='ignore')
          for n in ['download','presign','signed','shareId','publicId','file_id','fileId','files/','objectKey','storage']:
              print('\n###',n)
              start=0; count=0
              while count < 12:
                  i=s.lower().find(n.lower(),start)
                  if i<0: break
                  print(s[max(0,i-260):min(len(s),i+520)].replace('\\n',' ')[:1000])
                  start=i+len(n); count+=1
          PY
