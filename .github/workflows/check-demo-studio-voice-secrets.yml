name: Check Demo Studio Voice Secrets

on:
  push:
    branches:
      - vii-125-demo-studio-voice-seed
    paths:
      - '.github/workflows/check-demo-studio-voice-secrets.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_VOICE_ID_RU: ${{ secrets.ELEVENLABS_VOICE_ID_RU }}
      ELEVENLABS_VOICE_ID_RU_RU: ${{ secrets.ELEVENLABS_VOICE_ID_RU_RU }}
      ELEVENLABS_VOICE_ID_EN: ${{ secrets.ELEVENLABS_VOICE_ID_EN }}
      ELEVENLABS_VOICE_ID_EN_US: ${{ secrets.ELEVENLABS_VOICE_ID_EN_US }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Report secret availability only
        shell: bash
        run: |
          report() {
            key="$1"
            value="${!key:-}"
            if [ -n "$value" ]; then
              echo "$key=available"
            else
              echo "$key=missing"
            fi
          }
          report ELEVENLABS_API_KEY
          report ELEVENLABS_VOICE_ID
          report ELEVENLABS_VOICE_ID_RU
          report ELEVENLABS_VOICE_ID_RU_RU
          report ELEVENLABS_VOICE_ID_EN
          report ELEVENLABS_VOICE_ID_EN_US
          report OPENAI_API_KEY
