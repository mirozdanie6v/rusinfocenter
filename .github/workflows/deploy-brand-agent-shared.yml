name: Deploy VIIVERSION Brand Agent via RIC

on:
  push:
    branches:
      - main
    paths:
      - '.deploy-brand-agent'
      - '.github/workflows/deploy-brand-agent-shared.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: 56fa9423ef85e05559f453af43ec400f
      CF_ZONE_NAME: viiversion.com
      TARGET_DOMAIN: agent.viiversion.com
      WORKER_NAME: viiversion-brand-agent

    steps:
      - name: Checkout VIIVERSION Brand Agent
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/viiversion
          ref: viiversion
          path: viiversion

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify shared Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo 'RIC shared Cloudflare credentials are available.'

      - name: Install and validate Brand Agent Worker
        working-directory: viiversion/brand-agent-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit
          node --check worker.js
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Prepare shared deployment config
        working-directory: viiversion/brand-agent-worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          cfg.name = process.env.WORKER_NAME;
          delete cfg.routes;
          delete cfg.account_id;
          fs.writeFileSync('wrangler.shared.jsonc', JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Deploy standalone Brand Agent Worker
        working-directory: viiversion/brand-agent-worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.shared.jsonc

      - name: Attach agent.viiversion.com
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"             -X PUT             -H 'Content-Type: application/json'             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             --data "{\"hostname\":\"${TARGET_DOMAIN}\",\"service\":\"${WORKER_NAME}\",\"zone_id\":\"${CF_ZONE_ID}\",\"zone_name\":\"${CF_ZONE_NAME}\"}")
          echo "$response" | jq '{success,result:{hostname:.result.hostname,service:.result.service,zone_name:.result.zone_name},errors}'
          test "$(echo "$response" | jq -r '.success')" = "true"
          test "$(echo "$response" | jq -r '.result.hostname')" = "${TARGET_DOMAIN}"
          test "$(echo "$response" | jq -r '.result.service')" = "${WORKER_NAME}"

      - name: Verify Brand MCP initialize
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          ready=0
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 20               -o /tmp/brand-init.json -w '%{http_code}'               -X POST "$base/mcp?deploy=${GITHUB_SHA}"               -H 'content-type: application/json'               -H 'accept: application/json, text/event-stream'               --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ric-shared-deploy","version":"1"}}}' || true)
            if [ "$code" = "200" ] && jq -e '.result.serverInfo.name == "viiversion-brand-agent" and .result.serverInfo.version == "0.7.0"' /tmp/brand-init.json >/dev/null 2>&1; then
              ready=1
              break
            fi
            echo "Brand Agent v0.7.0 not ready yet (attempt $attempt, HTTP $code)"
            sleep 5
          done
          test "$ready" -eq 1
          jq '{jsonrpc,id,result:{protocolVersion:.result.protocolVersion,serverInfo:.result.serverInfo,capabilities:.result.capabilities}}' /tmp/brand-init.json

      - name: Verify MCP tools
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          curl -fsS -X POST "$base/mcp"             -H 'content-type: application/json'             -H 'accept: application/json, text/event-stream'             --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'             > /tmp/brand-tools.json
          echo "Actual MCP tools:"
          jq -r '[.result.tools[].name] | sort | .[]' /tmp/brand-tools.json
          jq -e '
            ([.result.tools[].name] | sort) ==
            (["accept_agent_artifact","create_agent_run","evaluate_market_signal","execute_agent_role","get_agent_run","get_brand_context","get_distribution_routes","get_live_source_plan","get_market_context","get_priority_entities","get_proof","plan_agent_roles","plan_brand_task","plan_gtm_motion","plan_market_projection","plan_productization","reject_agent_artifact","run_brand_task","validate_brand_output","validate_live_context"] | sort)
          ' /tmp/brand-tools.json >/dev/null

          curl -fsS -X POST "$base/mcp"             -H 'content-type: application/json'             -H 'accept: application/json, text/event-stream'             --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_brand_context","arguments":{"surface":"website","audience":"SME owner","goal":"clarity"}}}'             > /tmp/brand-context.json
          jq -e '
            .result.structuredContent.company.brand == "VIIVERSION" and
            ([.result.structuredContent.company.directions[].id] | index("DIR-ENG") != null) and
            ([.result.structuredContent.company.directions[].id] | index("DIR-SW") != null)
          ' /tmp/brand-context.json >/dev/null
          echo 'VIIVERSION Brand MCP production verified.'

      - name: Verify specialist role router
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"

          curl -fsS -X POST "$base/mcp" \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":31,"method":"tools/call","params":{"name":"plan_agent_roles","arguments":{"task":"Build the current Booking page for the VIIVERSION website","surface":"website","current_state":true,"final_public":true}}}' \
            > /tmp/brand-role-plan.json

          jq -e '
            (.result.structuredContent.route | index("source-truth") != null) and
            (.result.structuredContent.route | index("brand-strategy") != null) and
            (.result.structuredContent.route | index("commercial-architect") != null) and
            (.result.structuredContent.route | index("channel-architect") != null) and
            (.result.structuredContent.route | index("proof-analyst") != null) and
            (.result.structuredContent.route | index("brand-qa") != null)
          ' /tmp/brand-role-plan.json >/dev/null
          echo 'VIIVERSION Brand specialist role routing QA PASS.'

      - name: Verify Workers AI specialist execution and handoff
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          run_id="brand-smoke-${GITHUB_RUN_ID}"

          payload=$(jq -nc --arg run_id "$run_id" '{
            jsonrpc:"2.0",id:40,method:"tools/call",
            params:{name:"create_agent_run",arguments:{
              run_id:$run_id,
              task:"Explain the canonical VIIVERSION brand identity without changing canon."
            }}
          }')
          curl -fsS -X POST "$base/mcp" -H 'content-type: application/json' --data "$payload" > /tmp/brand-run-create.json

          jq -e '
            .result.structuredContent.status == "ACTIVE" and
            .result.structuredContent.nextRole == "brand-strategy" and
            (.result.structuredContent.route | index("brand-qa") != null)
          ' /tmp/brand-run-create.json >/dev/null

          payload=$(jq -nc --arg run_id "$run_id" '{
            jsonrpc:"2.0",id:41,method:"tools/call",
            params:{name:"execute_agent_role",arguments:{
              run_id:$run_id,
              role:"brand-strategy",
              invocation_id:"smoke-brand-strategy-v1"
            }}
          }')
          curl -fsS -X POST "$base/mcp" -H 'content-type: application/json' --data "$payload" > /tmp/brand-role-execute.json

          jq -e '
            .result.structuredContent.role == "brand-strategy" and
            .result.structuredContent.model == "@cf/meta/llama-3.3-70b-instruct-fp8-fast" and
            .result.structuredContent.artifact.type == "brand-decision" and
            .result.structuredContent.artifact.status == "PENDING" and
            .result.structuredContent.artifact.validation.status == "PASS"
          ' /tmp/brand-role-execute.json >/dev/null || { echo "brand role execute response:"; cat /tmp/brand-role-execute.json; exit 1; }

          artifact_id=$(jq -r '.result.structuredContent.artifact.artifactId' /tmp/brand-role-execute.json)
          test -n "$artifact_id"
          test "$artifact_id" != "null"

          payload=$(jq -nc --arg run_id "$run_id" --arg artifact_id "$artifact_id" '{
            jsonrpc:"2.0",id:42,method:"tools/call",
            params:{name:"accept_agent_artifact",arguments:{
              run_id:$run_id,
              artifact_id:$artifact_id
            }}
          }')
          curl -fsS -X POST "$base/mcp" -H 'content-type: application/json' --data "$payload" > /tmp/brand-artifact-accept.json

          jq -e '
            .result.structuredContent.status == "ACTIVE" and
            .result.structuredContent.nextRole == "brand-qa" and
            (.result.structuredContent.acceptedArtifacts | length) == 1 and
            .result.structuredContent.acceptedArtifacts[0].type == "brand-decision" and
            .result.structuredContent.acceptedArtifacts[0].status == "ACCEPTED"
          ' /tmp/brand-artifact-accept.json >/dev/null

          payload=$(jq -nc --arg run_id "$run_id" '{
            jsonrpc:"2.0",id:43,method:"tools/call",
            params:{name:"get_agent_run",arguments:{run_id:$run_id}}
          }')
          curl -fsS -X POST "$base/mcp" -H 'content-type: application/json' --data "$payload" > /tmp/brand-run-read.json

          jq -e '
            .result.structuredContent.nextRole == "brand-qa" and
            ([.result.structuredContent.audit[].event] | index("ROLE_EXECUTED") != null) and
            ([.result.structuredContent.audit[].event] | index("ARTIFACT_ACCEPTED") != null) and
            ([.result.structuredContent.audit[].event] | index("HANDOFF_READY") != null)
          ' /tmp/brand-run-read.json >/dev/null

          source_run_id="brand-source-guard-${GITHUB_RUN_ID}"
          payload=$(jq -nc --arg run_id "$source_run_id" '{
            jsonrpc:"2.0",id:44,method:"tools/call",
            params:{name:"create_agent_run",arguments:{
              run_id:$run_id,
              task:"What is the current Booking sellability?",
              current_state:true
            }}
          }')
          curl -fsS -X POST "$base/mcp" -H 'content-type: application/json' --data "$payload" > /tmp/brand-source-create.json
          jq -e '.result.structuredContent.nextRole == "source-truth"' /tmp/brand-source-create.json >/dev/null

          payload=$(jq -nc --arg run_id "$source_run_id" '{
            jsonrpc:"2.0",id:45,method:"tools/call",
            params:{name:"execute_agent_role",arguments:{
              run_id:$run_id,
              role:"source-truth",
              invocation_id:"smoke-source-guard-v1"
            }}
          }')
          curl -fsS -X POST "$base/mcp" -H 'content-type: application/json' --data "$payload" > /tmp/brand-source-guard.json
          jq -e '.error.message | contains("SOURCE_EVIDENCE_REQUIRED")' /tmp/brand-source-guard.json >/dev/null

          echo 'VIIVERSION Brand Workers AI role execution + Durable Object handoff QA PASS.'

      - name: Verify autonomous Brand run
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          run_id="brand-auto-${GITHUB_RUN_ID}"
          evidence='[{"evidenceId":"live-e2e","source":"VIIVERSION live source bundle","content":"VIIVERSION is a global engineering product company. DIR-ENG and DIR-SW are canonical. P07 Booking engine is Sell now. A01 MAX TOUR is a Full-stack demo; A03 UNIQ SMART RENT is a Production-oriented demo. Proof maturity must not be upgraded. Website must lead with clarity and proof. GTM uses Entity × Market × Audience × Channel × Language × Goal."}]'
          payload=$(jq -nc --arg run_id "$run_id" --argjson evidence "$evidence" '{jsonrpc:"2.0",id:60,method:"tools/call",params:{name:"run_brand_task",arguments:{run_id:$run_id,task:"Create the current final public VIIVERSION Booking Engine website projection and GTM direction for an international SME audience, with proof and independent QA.",surface:"website",current_state:true,final_public:true,max_rework_cycles:2,observed_at:"2026-09-30T12:00:00Z",source_classes:["L1_identity","L3_market_brand","L2_commercial_matrix","proof_registry","website_projection","distribution_state"],tabs_read:["Entity_Registry","Products","Offers","Verticals","Assets","Website_Decisions","Homepage_Blocks","UX_Rules","Website_Mapping","Channel_Profiles","Projection_Index","Market_Signals","Distribution_Matrix","Launch_Waves","GTM_Motions","Distribution_Pipeline","Daily_GTM"],source_evidence:$evidence}}}')
          curl -fsS --max-time 300 -X POST "$base/mcp" -H 'content-type: application/json' --data "$payload" > /tmp/brand-auto.json
          jq -e '
            .result.structuredContent.status == "COMPLETED" and
            (.result.structuredContent.route | length) == 7 and
            ([.result.structuredContent.acceptedArtifacts[] | select(.type == "qa-report") | .payload.decision] | last) == "PASS" and
            (.result.structuredContent.finalResult.answer | length) > 20 and
            ([.result.structuredContent.audit[].event] | index("FINAL_RESULT_ASSEMBLED") != null)
          ' /tmp/brand-auto.json >/dev/null || { echo "autonomous response:"; cat /tmp/brand-auto.json; exit 1; }
          echo 'VIIVERSION Brand autonomous E2E PASS.'

      - name: Verify GTM / productization tools
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"

          curl -fsS -X POST "$base/mcp"             -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"plan_gtm_motion","arguments":{"task":"Launch Proposal Studio internationally through Product Hunt and ChatGPT App Directory","entity_id":"P28","market":"Global","audience":"software users","goal":"adoption"}}}'             > /tmp/brand-gtm.json
          jq -e '.result.structuredContent.primaryMotion.id == "M04" or .result.structuredContent.primaryMotion.id == "M05"' /tmp/brand-gtm.json >/dev/null

          curl -fsS -X POST "$base/mcp"             -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"plan_productization","arguments":{"concept":"A new VIIVERSION plugin for a platform marketplace","target_platforms":["WordPress.org"]}}}'             > /tmp/brand-productization.json
          jq -e '
            .result.structuredContent.entityState == "candidate_or_unmapped_concept" and
            .result.structuredContent.canonicalMutationAllowed == false and
            .result.structuredContent.implementationClaimAllowed == false
          ' /tmp/brand-productization.json >/dev/null

          curl -fsS -X POST "$base/mcp"             -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"evaluate_market_signal","arguments":{"observation":"One prospect requested a new product type","repeated_evidence_count":1,"propose_change":true}}}'             > /tmp/brand-signal.json
          jq -e '
            .result.structuredContent.stage == "Observation" and
            .result.structuredContent.canonicalMutationAllowed == false
          ' /tmp/brand-signal.json >/dev/null
          echo 'VIIVERSION Brand GTM/Productization QA PASS.'

      - name: Verify live Source of Truth gate
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"

          curl -fsS -X POST "$base/mcp"             -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":7,"method":"tools/call","params":{"name":"get_live_source_plan","arguments":{"task":"What are the current Booking sellability and proof records?","current_state":true}}}'             > /tmp/brand-live-plan.json

          jq -e '
            .result.structuredContent.liveRequired == true and
            (.result.structuredContent.commercialMatrix.tabs | index("Products") != null) and
            (.result.structuredContent.commercialMatrix.tabs | index("Assets") != null)
          ' /tmp/brand-live-plan.json >/dev/null

          curl -fsS -X POST "$base/mcp"             -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":8,"method":"tools/call","params":{"name":"validate_live_context","arguments":{"task":"What are the current Booking sellability and proof records?","current_state":true,"source_classes":["L1_identity","L2_commercial_matrix","proof_registry"],"tabs_read":["Entity_Registry","Products","Offers","Verticals","Assets"]}}}'             > /tmp/brand-live-gate.json

          jq -e '.result.structuredContent.pass == true' /tmp/brand-live-gate.json >/dev/null
          echo 'VIIVERSION Brand live Source of Truth QA PASS.'
