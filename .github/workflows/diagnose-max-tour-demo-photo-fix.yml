name: Diagnose MAX TOUR demo photo fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.diagnose-max-tour-demo-photo-fix'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SERVICE: max-tour-demo-v28
      TARGET: https://max-tour-demo.viiversion.com
    steps:
      - name: Diagnose live state read-only
        shell: bash
        run: |
          set -u
          echo '=== ROOT ==='
          curl -L -sS -D /tmp/root.h "${TARGET}/?diag=${GITHUB_SHA}" -o /tmp/root.html
          grep -i '^HTTP\|^content-type' /tmp/root.h || true
          echo "root_bytes=$(wc -c < /tmp/root.html)"
          echo "marker_count=$(grep -o 'data-max-tour-card-photo-fix="20260916"' /tmp/root.html | wc -l)"
          echo "tour_selector_count=$(grep -o "document.querySelectorAll('.tour-card')" /tmp/root.html | wc -l)"
          echo "wide_selector_count=$(grep -o "document.querySelectorAll('.tour-card,.wide-card')" /tmp/root.html | wc -l)"

          echo '=== API HEALTH ==='
          curl -L -sS -w '\nHTTP=%{http_code}\n' "${TARGET}/api/health?diag=${GITHUB_SHA}" -o /tmp/health.json
          cat /tmp/health.json
          echo

          echo '=== BOOTSTRAP ==='
          code=$(curl -L -sS -w '%{http_code}' "${TARGET}/api/bootstrap?diag=${GITHUB_SHA}" -o /tmp/bootstrap.json)
          echo "bootstrap_http=$code bytes=$(wc -c < /tmp/bootstrap.json)"
          if jq empty /tmp/bootstrap.json >/dev/null 2>&1; then
            echo 'top-level keys:'
            jq -r 'keys[]' /tmp/bootstrap.json || true
            echo 'all titles matching orchid/monkey:'
            jq -r '.. | objects | select(.title? != null) | select(.title | test("Орхид|Обезьян";"i")) | [.id,.title,.image,.fallbackImage] | @tsv' /tmp/bootstrap.json || true
            echo 'all titles matching Hon Tam:'
            jq -r '.. | objects | select(.title? != null) | select(.title | test("Хон Там|Hon Tam";"i")) | [.id,.title,.image,.fallbackImage] | @tsv' /tmp/bootstrap.json || true
            echo 'customTours count:'
            jq '.customTours | if type=="array" then length else -1 end' /tmp/bootstrap.json || true
          else
            head -c 1500 /tmp/bootstrap.json
            echo
          fi

          echo '=== BINDINGS ==='
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/${SERVICE}/environments/production/settings" \
            | jq -r '.result.bindings[]? | [.name,.type] | @tsv' | sort
