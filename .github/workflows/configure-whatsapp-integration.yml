name: Configure VIIVERSION WhatsApp Coexistence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.configure-whatsapp-integration'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_EMBEDDED_SIGNUP_CONFIG_ID: ${{ secrets.META_EMBEDDED_SIGNUP_CONFIG_ID }}
      META_WHATSAPP_VERIFY_TOKEN: ${{ secrets.META_WHATSAPP_VERIFY_TOKEN }}
      WORKER_NAME: viiversion-integration

    steps:
      - name: Checkout VIIVERSION integration service
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/viiversion
          ref: main
          path: viiversion

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare and Meta credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID META_APP_ID META_APP_SECRET META_EMBEDDED_SIGNUP_CONFIG_ID META_WHATSAPP_VERIFY_TOKEN; do
            test -n "${!name:-}" || { echo "$name is missing"; exit 1; }
          done

      - name: Install Wrangler
        working-directory: viiversion/integration-service
        run: npm install --no-fund --no-audit

      - name: Prepare shared Worker config
        working-directory: viiversion/integration-service
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          cfg.name = process.env.WORKER_NAME;
          delete cfg.routes;
          fs.writeFileSync('wrangler.shared.jsonc', JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Apply Coexistence configuration to Worker
        working-directory: viiversion/integration-service
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            name="$1"
            value="$2"
            printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.shared.jsonc >/dev/null
            echo "$name configured."
          }
          put_secret META_APP_ID "$META_APP_ID"
          put_secret META_APP_SECRET "$META_APP_SECRET"
          put_secret META_EMBEDDED_SIGNUP_CONFIG_ID "$META_EMBEDDED_SIGNUP_CONFIG_ID"
          put_secret META_WHATSAPP_VERIFY_TOKEN "$META_WHATSAPP_VERIFY_TOKEN"

      - name: Verify configuration names and production health
        working-directory: viiversion/integration-service
        shell: bash
        run: |
          set -euo pipefail
          names="$(npx wrangler secret list --config wrangler.shared.jsonc)"
          for name in META_APP_ID META_APP_SECRET META_EMBEDDED_SIGNUP_CONFIG_ID META_WHATSAPP_VERIFY_TOKEN; do
            echo "$names" | jq -e --arg name "$name" 'map(.name) | index($name) != null' >/dev/null
          done
          curl -fsS https://integration.viiversion.com/health | jq -e '.ok == true and .whatsapp.embeddedSignupConfigured == true and .whatsapp.webhookConfigured == true' >/dev/null
          echo 'WhatsApp Coexistence configuration is ready.'
