name: Inspect MAX TOUR demo code shape

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.inspect-max-tour-demo-code-shape'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SERVICE: max-tour-demo-v28
    steps:
      - name: Inspect all ASSETS fetch branches read-only
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/${SERVICE}/environments/production/content"
          curl -fsS -D /tmp/h -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url" -o /tmp/body
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('/tmp/h').read_text(errors='replace')
          b=Path('/tmp/body').read_bytes()
          boundary=re.search(r'boundary=([^;\r\n]+)',h,re.I).group(1).strip('"')
          module=None
          for p in b.split(('--'+boundary).encode()):
              p=p.strip(b'\r\n-')
              head,sep,data=p.partition(b'\r\n\r\n')
              if sep and b'name="worker-r2.js"' in head: module=data
          if module is None: raise SystemExit('worker-r2.js not found')
          s=module.decode('utf-8','replace')
          for idx,m in enumerate(re.finditer(r'ASSETS\.fetch',s),1):
              pos=m.start()
              print(f'--- ASSETS.fetch #{idx} at {pos} ---')
              print(s[max(0,pos-900):min(len(s),pos+1800)])
          for needle in ['async fetch(request','fetch: async','async fetch(req','pathname === "/"','pathname==="/"']:
              print('NEEDLE',needle,'COUNT',s.count(needle))
          PY
