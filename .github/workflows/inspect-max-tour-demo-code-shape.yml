name: Inspect MAX TOUR demo code shape

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.inspect-max-tour-demo-code-shape'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SERVICE: max-tour-demo-v28
    steps:
      - name: Extract target tour records read-only
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/${SERVICE}/environments/production/content"
          curl -fsS -D /tmp/h -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url" -o /tmp/body
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('/tmp/h').read_text(errors='replace')
          b=Path('/tmp/body').read_bytes()
          m=re.search(r'boundary=([^;\r\n]+)',h,re.I)
          if not m: raise SystemExit('no boundary')
          boundary=m.group(1).strip('"')
          module=None
          for i,p in enumerate(b.split(('--'+boundary).encode())):
              p=p.strip(b'\r\n-')
              if not p: continue
              head,sep,data=p.partition(b'\r\n\r\n')
              if not sep: continue
              hs=head.decode('utf-8','replace')
              print('PART',i,hs.replace('\r\n',' | '),'bytes',len(data))
              if 'name="worker-r2.js"' in hs:
                  module=data
          if module is None: raise SystemExit('worker-r2.js not found')
          s=module.decode('utf-8','replace')
          print('MODULE_BYTES',len(s))
          for title in ['Остров Орхидей и Остров Обезьян','Остров Хон Там']:
              print('TITLE_COUNT',title,s.count(title))
              pos=s.find(title)
              if pos < 0: continue
              print('---TARGET',title,'---')
              print(s[max(0,pos-700):min(len(s),pos+1400)])
          for n in ['ASSETS.fetch','TOUR_MEDIA','safeImg(t)','fallbackImage']:
              print('COUNT',n,s.count(n))
          PY
