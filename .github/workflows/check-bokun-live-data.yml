name: Check Bókun Live Integration Data

on:
  push:
    branches:
      - main
    paths:
      - '.check-bokun-live-data'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query selected Bókun product data
        shell: bash
        run: |
          set -euo pipefail
          base="https://integration.viiversion.com"
          vendor="137689"

          echo '=== STATUS ==='
          curl -fsS "$base/api/bokun/status?vendorId=$vendor" | jq .

          for product in 1287578 1287580; do
            echo "=== PRODUCT $product ==="
            curl -fsS "$base/api/bokun/product?vendorId=$vendor&productId=$product" \
              | jq 'del(.vendor)'

            echo "=== AVAILABILITY $product ==="
            curl -fsS "$base/api/bokun/availability?vendorId=$vendor&productId=$product&start=2026-09-26&end=2026-10-10&currency=USD" \
              | jq '{entries:length, dates:[.[].localizedDate], samples:(.[0:2])}'
          done
