name: Inspect Telegram links

on:
  push:
    paths:
      - .github/workflows/inspect-telegram-links.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current source release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ric-src /tmp/source.tar.gz
          mkdir -p /tmp/ric-src
          gh release download source-v33 -p source.tar.gz -D /tmp
          tar -xzf /tmp/source.tar.gz -C /tmp/ric-src
          {
            echo '=== FILES ==='
            find /tmp/ric-src -maxdepth 4 -type f -printf '%p\n' | head -300
            echo '=== TELEGRAM TEXT ==='
            find /tmp/ric-src -type f -size -20M -print0 | while IFS= read -r -d '' f; do strings "$f" 2>/dev/null | grep -Eio 'https?://t\.me/[A-Za-z0-9_+/?=&.-]+|@[A-Za-z0-9_]{5,}([Bb][Oo][Tt])|[A-Za-z0-9_]{5,}bot' || true; done | sort -u
            echo '=== TELEGRAM CONTEXT ==='
            find /tmp/ric-src -type f -size -20M -print0 | while IFS= read -r -d '' f; do strings "$f" 2>/dev/null | grep -Ei 'telegram|t\.me|web_app|bot' | head -50 || true; done | head -300
          } > telegram-inspection.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram-inspection.txt
          git commit -m 'Temporary deep Telegram inspection output'
          git push
