name: Deploy UNIQ copy to VIIVERSION Cloudflare

on:
  push:
    branches:
      - ops/deploy-uniq-smart-rent-copy
    paths:
      - '.github/workflows/deploy-uniq-copy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@v5

      - name: Checkout current UNIQ Smart Rent Stage 11
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/uniq-smart-rent
          ref: refactor/react-typescript-vite-demo
          path: uniq-smart-rent

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install and verify UNIQ
        working-directory: uniq-smart-rent
        run: |
          set -euo pipefail
          npm install
          npm run check

      - name: Ensure D1 database in VIIVERSION account
        working-directory: uniq-smart-rent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          list=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=uniq-smart-rent-db&per_page=100" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          test "$(echo "$list" | jq -r '.success')" = "true"
          db_id=$(echo "$list" | jq -r '.result[0].uuid // empty')
          if [ -z "$db_id" ]; then
            created=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --data '{"name":"uniq-smart-rent-db","primary_location_hint":"apac"}')
            test "$(echo "$created" | jq -r '.success')" = "true"
            db_id=$(echo "$created" | jq -r '.result.uuid')
          fi
          test -n "$db_id"
          cat > wrangler-copy.jsonc <<EOF
          {
            "\$schema":"./node_modules/wrangler/config-schema.json",
            "name":"uniq-smart-rent",
            "main":"src/worker.ts",
            "compatibility_date":"2026-08-25",
            "workers_dev":true,
            "assets":{"directory":"./dist","binding":"ASSETS","not_found_handling":"single-page-application","run_worker_first":["/api/*"]},
            "d1_databases":[{"binding":"DB","database_name":"uniq-smart-rent-db","database_id":"${db_id}","migrations_dir":"migrations"}],
            "vars":{"DEMO_MODE":"true"},
            "observability":{"enabled":true}
          }
          EOF
          echo "D1 database ready: $db_id"

      - name: Apply D1 migrations
        working-directory: uniq-smart-rent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply uniq-smart-rent-db --remote --config wrangler-copy.jsonc

      - name: Deploy UNIQ Worker copy
        working-directory: uniq-smart-rent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler-copy.jsonc

      - name: Attach uniq-smart-rent.viiversion.com
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" -X PUT -H 'Content-Type: application/json' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --data '{"hostname":"uniq-smart-rent.viiversion.com","service":"uniq-smart-rent","zone_id":"56fa9423ef85e05559f453af43ec400f","zone_name":"viiversion.com"}')
          test "$(echo "$response" | jq -r '.success')" = "true"
          test "$(echo "$response" | jq -r '.result.hostname')" = "uniq-smart-rent.viiversion.com"
          test "$(echo "$response" | jq -r '.result.service')" = "uniq-smart-rent"

      - name: Verify custom domain and Stage 11
        shell: bash
        run: |
          set -euo pipefail
          base='https://uniq-smart-rent.viiversion.com'
          ok=0
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 15 -o /tmp/uniq-home.html -w '%{http_code}' "$base/" || true)
            if [ "$code" = "200" ] && grep -q 'UNIQ Smart Rent' /tmp/uniq-home.html; then
              asset=$(grep -oE 'src="[^"]*assets/index-[^"]+\.js"' /tmp/uniq-home.html | head -1 | cut -d'"' -f2 || true)
              css=$(grep -oE 'href="[^"]*assets/index-[^"]+\.css"' /tmp/uniq-home.html | head -1 | cut -d'"' -f2 || true)
              if [ -n "$asset" ] && [ -n "$css" ]; then
                curl -fsSL "$base$asset" -o /tmp/uniq-app.js
                curl -fsSL "$base$css" -o /tmp/uniq-app.css
                if grep -q 'Что приносит деньги' /tmp/uniq-app.js && grep -q 'analytics-page' /tmp/uniq-app.css && grep -q 'Возврат сегодня' /tmp/uniq-app.js; then
                  health=$(curl -fsSL "$base/api/health")
                  analytics=$(curl -fsSL -H 'x-uniq-demo-role: owner' "$base/api/owner/analytics?period=7d&branch=all")
                  test "$(echo "$health" | jq -r '.schemaVersion')" = "11"
                  test "$(echo "$health" | jq -r '.ownerAnalytics')" = "true"
                  test "$(echo "$health" | jq -r '.analyticsFunnel')" = "true"
                  test "$(echo "$health" | jq -r '.vehicleProfitability')" = "true"
                  test "$(echo "$health" | jq -r '.demoRequestDataset')" = "true"
                  test "$(echo "$analytics" | jq -r '.persisted')" = "true"
                  test "$(echo "$analytics" | jq -r '.funnel | length')" -eq 5
                  test "$(echo "$analytics" | jq -r '.vehicles | length')" -ge 4
                  test "$(echo "$analytics" | jq -r '.statuses | length')" -ge 6
                  test "$(echo "$analytics" | jq -r '.kpis.bookings')" -ge 15
                  test "$(echo "$analytics" | jq -r '[.statuses[] | select(.status == "return_due")] | length')" -ge 1
                  echo "Verified $base/: HTTP 200 + Stage 11 Analytics + 20 varied DEMO bookings + D1 analytics API"
                  ok=1
                  break
                fi
              fi
            fi
            echo "Stage 11 deployment not ready yet (attempt $attempt, HTTP $code)"
            sleep 5
          done
          test "$ok" -eq 1
