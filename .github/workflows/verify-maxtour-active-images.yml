name: Verify MAX TOUR active images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.verify-maxtour-active-images'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET: https://maxtourvietnam.viiversion.com
    steps:
      - name: Verify API and active production image assets read-only
        shell: bash
        run: |
          set -euo pipefail
          curl -L -fsS "${TARGET}/api/health?active=${GITHUB_SHA}" -o /tmp/health.json
          jq -e '.ok == true and .project == "maxtourvietnam"' /tmp/health.json >/dev/null
          curl -L -fsS "${TARGET}/api/tours?active=${GITHUB_SHA}" -o /tmp/tours.json
          jq -e '.tours | length == 28' /tmp/tours.json >/dev/null

          check_hash() {
            local path="$1" expected_size="$2" expected_sha="$3"
            local out="/tmp/a-$(echo "$path" | tr '/.' '__')"
            curl -L -fsS -D /tmp/h "${TARGET}${path}" -o "$out"
            grep -qi '^content-type: image/' /tmp/h || grep -qi '^content-type:.*svg' /tmp/h
            local size sha
            size=$(wc -c < "$out")
            sha=$(sha256sum "$out" | awk '{print $1}')
            printf '%s size=%s sha256=%s\n' "$path" "$size" "$sha"
            test "$size" = "$expected_size"
            test "$sha" = "$expected_sha"
          }

          check_hash /mirror-media/789cbd1e52fbe2bb96.png 933879 e4197eaea052aba5fe4115562d5aee61243eaff8c46e8aa8fe6dac8a98edb09b
          check_hash /mirror-media/dbdd4c7c7a1a8b401d.png 761393 61c063925e184ff8c590c3694081f84ee2857eb3e9a0be258c0711af1c037334
          check_hash /mirror-media/b61ebe9d9d537cde4c.png 1035605 5c9579db9ac185c4e63b8803db940d18611052ff8eb39e4961cc97532f2a5f85
          check_hash /mirror-media/41a8eaf3295d53b2f3.png 2097795 ed1fccfdc6fea03cf0d5d9d85f8f7577eac39a6e085b756c127f2b9b21cecf15
          check_hash /mirror-media/979b9b42c26fa733e0.png 1830184 f239b7aabaea1a3d9359f3d671cc8d9dd2ba73e96aa80977f2a61e92a90595d6
          check_hash /mirror-media/4428f3e199f4015673.png 1019251 a2fab5de7eda6ef6f54cb296b31c290133b2a8e3eec7d94a050e81a384ca9963

          for path in \
            /mirror-media/00413657b7f65d00ba.png \
            /mirror-media/361ac068da624260ee.png \
            /mirror-media/1c73f0747a82e1f65e.png \
            /mirror-media/18420369e936c62fb0.jpg \
            /mirror-media/642f704088af4e3d48.png \
            /mirror-media/0f2183c05583ed5181.jpg \
            /mirror-media/ce6ad3ce78adc4fb82.png \
            /mirror-media/31704dd18a60706436.png \
            /mirror-media/e7e97b7767ad71ce9c.png \
            /mirror-media/cee24f1bf577f715f9.png \
            /mirror-media/7892b857d3c77fe48a.png \
            /mirror-media/9191aea8c66c333146.png \
            /mirror-media/719a9ef6660e04585b.png \
            /mirror-media/2bbe269bda916251f8.png \
            /mirror-media/8884a36ff2782b39ad.png \
            /mirror-media/a22a64d26795b243be.png; do
            out="/tmp/p-$(echo "$path" | tr '/.' '__')"
            curl -L -fsS -D /tmp/ph "${TARGET}${path}" -o "$out"
            grep -qi '^content-type: image/' /tmp/ph || grep -qi '^content-type:.*svg' /tmp/ph
            test "$(wc -c < "$out")" -gt 1000
            printf 'OK %s %s bytes\n' "$path" "$(wc -c < "$out")"
          done

          echo 'ACTIVE IMAGE VERIFY PASS'
