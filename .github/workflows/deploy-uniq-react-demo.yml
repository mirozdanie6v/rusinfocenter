name: Deploy UNIQ development to VIIVERSION Cloudflare

on:
  push:
    branches:
      - ops/deploy-uniq-smart-rent-copy
    paths:
      - '.github/workflows/deploy-uniq-react-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@v5

      - name: Checkout UNIQ React migration branch
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/uniq-smart-rent
          ref: refactor/react-typescript-vite-demo
          path: uniq-smart-rent

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install and verify migration build
        working-directory: uniq-smart-rent
        run: |
          set -euo pipefail
          npm install
          npm run check

      - name: Ensure development D1 database
        working-directory: uniq-smart-rent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          list=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=uniq-smart-rent-demo-db&per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          test "$(echo "$list" | jq -r '.success')" = "true"
          db_id=$(echo "$list" | jq -r '.result[0].uuid // empty')
          if [ -z "$db_id" ]; then
            created=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -X POST \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --data '{"name":"uniq-smart-rent-demo-db","primary_location_hint":"apac"}')
            test "$(echo "$created" | jq -r '.success')" = "true"
            db_id=$(echo "$created" | jq -r '.result.uuid')
          fi
          test -n "$db_id"
          cat > wrangler-development.jsonc <<EOF
          {
            "\$schema":"./node_modules/wrangler/config-schema.json",
            "name":"uniq-smart-rent",
            "main":"src/worker.ts",
            "compatibility_date":"2026-08-25",
            "workers_dev":true,
            "vars":{"DEMO_MODE":"true"},
            "assets":{"directory":"./dist","binding":"ASSETS","not_found_handling":"single-page-application","run_worker_first":["/api/*"]},
            "d1_databases":[{"binding":"DB","database_name":"uniq-smart-rent-demo-db","database_id":"${db_id}","migrations_dir":"migrations"}],
            "observability":{"enabled":true}
          }
          EOF
          echo "Development D1 ready: $db_id"

      - name: Apply development D1 migrations
        working-directory: uniq-smart-rent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply uniq-smart-rent-demo-db --remote --config wrangler-development.jsonc

      - name: Deploy Stage 4 into uniq-smart-rent Worker
        working-directory: uniq-smart-rent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler-development.jsonc

      - name: Verify primary custom domain binding
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          domains=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          match=$(echo "$domains" | jq -c '[.result[]? | select(.hostname == "uniq-smart-rent.viiversion.com")][0] // empty')
          test -n "$match"
          echo "$match" | jq '{hostname,service,environment,zone_name}'
          test "$(echo "$match" | jq -r '.service')" = "uniq-smart-rent"

      - name: Verify primary development domain
        shell: bash
        run: |
          set -euo pipefail
          base='https://uniq-smart-rent.viiversion.com'
          ok=0
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 15 -o /tmp/uniq-development.html -w '%{http_code}' "$base/" || true)
            if [ "$code" = "200" ] && grep -q 'UNIQ Smart Rent' /tmp/uniq-development.html; then
              echo "Verified $base/: HTTP 200"
              ok=1
              break
            fi
            echo "Development domain not ready yet (attempt $attempt, HTTP $code)"
            sleep 5
          done
          test "$ok" -eq 1

      - name: Verify Stage 4 D1 calendar and rental lifecycle
        working-directory: uniq-smart-rent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base='https://uniq-smart-rent.viiversion.com'
          health=''
          health_ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/uniq-health.json -w '%{http_code}' "$base/api/health" || true)
            schema='n/a'
            if [ "$code" = "200" ]; then
              health=$(cat /tmp/uniq-health.json)
              schema=$(echo "$health" | jq -r '.schemaVersion // "n/a"' 2>/dev/null || echo 'n/a')
              if [ "$(echo "$health" | jq -r '.ok // false')" = "true" ] \
                && [ "$schema" = "5" ] \
                && [ "$(echo "$health" | jq -r '.bookingCalendar // false')" = "true" ] \
                && [ "$(echo "$health" | jq -r '.rentalLifecycle // false')" = "true" ]; then
                echo "Stage 4 API ready on attempt $attempt"
                health_ready=1
                break
              fi
            fi
            echo "Stage 4 API not ready yet (attempt $attempt, HTTP $code, schema=$schema)"
            sleep 5
          done
          test "$health_ready" -eq 1
          echo "$health" | jq '{ok,d1Ready,schemaVersion,ownerFleetManagement,bookingCalendar,rentalLifecycle}'
          test "$(echo "$health" | jq -r '.schemaVersion')" = "5"
          test "$(echo "$health" | jq -r '.ownerFleetManagement')" = "true"
          test "$(echo "$health" | jq -r '.bookingCalendar')" = "true"
          test "$(echo "$health" | jq -r '.rentalLifecycle')" = "true"

          vehicle_id="custom-stage4-smoke-${GITHUB_RUN_ID}"
          contact="stage4-smoke-${GITHUB_RUN_ID}"
          from=$(date -u -d '+30 days' +%F)
          to=$(date -u -d '+32 days' +%F)
          extended_to=$(date -u -d '+35 days' +%F)
          calendar_to=$(date -u -d '+37 days' +%F)

          cleanup() {
            if [ -n "${booking_id:-}" ]; then
              npx wrangler d1 execute uniq-smart-rent-demo-db --remote --config wrangler-development.jsonc --command "DELETE FROM activity_log WHERE entity_id='${booking_id}'; DELETE FROM booking_extensions WHERE booking_id='${booking_id}'; DELETE FROM booking_status_history WHERE booking_id='${booking_id}'; DELETE FROM bookings WHERE id='${booking_id}'; DELETE FROM customers WHERE contact='${contact}'; DELETE FROM activity_log WHERE entity_id='${vehicle_id}'; DELETE FROM vehicles WHERE id='${vehicle_id}';" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          vehicle_payload=$(jq -nc --arg id "$vehicle_id" '{id:$id,title:"Stage 4 Calendar Scooter",type:"scooter",brand:"UNIQ",model:"Calendar 125",year:2026,engine:"125 cc",dailyVnd:600000,threeDayVnd:1650000,weeklyVnd:3300000,fourteenDayVnd:6200000,monthlyVnd:11000000,depositVnd:3000000,branchId:"branch-center",status:"ready",published:true,photos:[]}')
          curl -fsS -X POST "$base/api/owner/fleet" -H 'content-type: application/json' -H 'x-uniq-demo-role: owner' --data "$vehicle_payload" >/tmp/stage4-vehicle.json
          test "$(jq -r '.persisted' /tmp/stage4-vehicle.json)" = "true"

          booking_payload=$(jq -nc --arg vehicleId "$vehicle_id" --arg from "$from" --arg to "$to" --arg contact "$contact" '{vehicleId:$vehicleId,from:$from,to:$to,client:"Stage 4 Smoke Rider",contact:$contact,channel:"telegram",deliveryLocation:"branch-center"}')
          booking=$(curl -fsS -X POST "$base/api/bookings" -H 'content-type: application/json' --data "$booking_payload")
          booking_id=$(echo "$booking" | jq -r '.bookingId')
          test -n "$booking_id"
          test "$(echo "$booking" | jq -r '.persisted')" = "true"

          curl -fsS -X PATCH "$base/api/bookings/$booking_id/status" -H 'content-type: application/json' -H 'x-uniq-demo-role: owner' --data '{"status":"confirmed"}' >/tmp/stage4-confirmed.json
          test "$(jq -r '.status' /tmp/stage4-confirmed.json)" = "confirmed"

          calendar=$(curl -fsS "$base/api/owner/calendar?from=$from&to=$calendar_to&type=scooter" -H 'x-uniq-demo-role: owner')
          test "$(echo "$calendar" | jq --arg id "$booking_id" 'any(.bookings[]?; .id == $id)')" = "true"

          availability=$(curl -fsS "$base/api/availability?vehicleId=$vehicle_id&from=$from&to=$to")
          test "$(echo "$availability" | jq -r '.requestAllowed')" = "false"

          issued=$(curl -fsS -X PATCH "$base/api/bookings/$booking_id/lifecycle" -H 'content-type: application/json' -H 'x-uniq-demo-role: employee' --data '{"action":"issue"}')
          test "$(echo "$issued" | jq -r '.status')" = "active"

          extension=$(curl -fsS -X PATCH "$base/api/bookings/$booking_id/extend" -H 'content-type: application/json' -H 'x-uniq-demo-role: owner' --data "$(jq -nc --arg newTo "$extended_to" '{newTo:$newTo,note:"Stage 4 smoke extension"}')")
          test "$(echo "$extension" | jq -r '.persisted')" = "true"
          test "$(echo "$extension" | jq -r '.additionalDays > 0')" = "true"

          returned=$(curl -fsS -X PATCH "$base/api/bookings/$booking_id/lifecycle" -H 'content-type: application/json' -H 'x-uniq-demo-role: employee' --data '{"action":"return"}')
          test "$(echo "$returned" | jq -r '.status')" = "returned"
          completed=$(curl -fsS -X PATCH "$base/api/bookings/$booking_id/lifecycle" -H 'content-type: application/json' -H 'x-uniq-demo-role: owner' --data '{"action":"complete"}')
          test "$(echo "$completed" | jq -r '.status')" = "completed"

          cleanup
          trap - EXIT
          echo 'Stage 4 live D1 calendar + availability + extension + issue/return verified on uniq-smart-rent.viiversion.com'

# Primary development domain fixed for Stage 4+: https://uniq-smart-rent.viiversion.com
# Stage 4 propagation-aware live gate: 2026-09-08
