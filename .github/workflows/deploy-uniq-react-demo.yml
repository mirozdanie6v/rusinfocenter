name: Deploy UNIQ development to VIIVERSION Cloudflare

on:
  push:
    branches:
      - ops/deploy-uniq-smart-rent-copy
    paths:
      - '.github/workflows/deploy-uniq-react-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@v5

      - name: Checkout UNIQ React migration branch
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/uniq-smart-rent
          ref: refactor/react-typescript-vite-demo
          path: uniq-smart-rent

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install and verify migration build
        working-directory: uniq-smart-rent
        run: |
          set -euo pipefail
          npm install
          npm run check

      - name: Ensure development D1 database
        working-directory: uniq-smart-rent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          list=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=uniq-smart-rent-demo-db&per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          test "$(echo "$list" | jq -r '.success')" = "true"
          db_id=$(echo "$list" | jq -r '.result[0].uuid // empty')
          if [ -z "$db_id" ]; then
            created=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -X POST \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --data '{"name":"uniq-smart-rent-demo-db","primary_location_hint":"apac"}')
            test "$(echo "$created" | jq -r '.success')" = "true"
            db_id=$(echo "$created" | jq -r '.result.uuid')
          fi
          test -n "$db_id"
          cat > wrangler-development.jsonc <<EOF
          {
            "\$schema":"./node_modules/wrangler/config-schema.json",
            "name":"uniq-smart-rent",
            "main":"src/worker.ts",
            "compatibility_date":"2026-08-25",
            "workers_dev":true,
            "vars":{"DEMO_MODE":"true"},
            "assets":{"directory":"./dist","binding":"ASSETS","not_found_handling":"single-page-application","run_worker_first":["/api/*"]},
            "d1_databases":[{"binding":"DB","database_name":"uniq-smart-rent-demo-db","database_id":"${db_id}","migrations_dir":"migrations"}],
            "observability":{"enabled":true}
          }
          EOF
          echo "Development D1 ready: $db_id"

      - name: Apply development D1 migrations
        working-directory: uniq-smart-rent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply uniq-smart-rent-demo-db --remote --config wrangler-development.jsonc

      - name: Deploy Stage 5 into uniq-smart-rent Worker
        working-directory: uniq-smart-rent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler-development.jsonc

      - name: Verify primary custom domain binding
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          domains=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          match=$(echo "$domains" | jq -c '[.result[]? | select(.hostname == "uniq-smart-rent.viiversion.com")][0] // empty')
          test -n "$match"
          echo "$match" | jq '{hostname,service,environment,zone_name}'
          test "$(echo "$match" | jq -r '.service')" = "uniq-smart-rent"

      - name: Verify primary development domain
        shell: bash
        run: |
          set -euo pipefail
          base='https://uniq-smart-rent.viiversion.com'
          ok=0
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 15 -o /tmp/uniq-development.html -w '%{http_code}' "$base/" || true)
            if [ "$code" = "200" ] && grep -q 'UNIQ Smart Rent' /tmp/uniq-development.html; then
              echo "Verified $base/: HTTP 200"
              ok=1
              break
            fi
            echo "Development domain not ready yet (attempt $attempt, HTTP $code)"
            sleep 5
          done
          test "$ok" -eq 1

      - name: Verify Stage 5 D1 payment checkout
        working-directory: uniq-smart-rent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base='https://uniq-smart-rent.viiversion.com'
          health=''
          health_ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/uniq-health.json -w '%{http_code}' "$base/api/health" || true)
            schema='n/a'
            if [ "$code" = "200" ]; then
              health=$(cat /tmp/uniq-health.json)
              schema=$(echo "$health" | jq -r '.schemaVersion // "n/a"' 2>/dev/null || echo 'n/a')
              if [ "$(echo "$health" | jq -r '.ok // false')" = "true" ] \
                && [ "$schema" = "6" ] \
                && [ "$(echo "$health" | jq -r '.ownerFleetManagement // false')" = "true" ] \
                && [ "$(echo "$health" | jq -r '.bookingCalendar // false')" = "true" ] \
                && [ "$(echo "$health" | jq -r '.rentalLifecycle // false')" = "true" ] \
                && [ "$(echo "$health" | jq -r '.paymentCheckout // false')" = "true" ] \
                && [ "$(echo "$health" | jq -r '.paymentProviders // 0')" = "7" ]; then
                echo "Stage 5 API ready on attempt $attempt"
                health_ready=1
                break
              fi
            fi
            echo "Stage 5 API not ready yet (attempt $attempt, HTTP $code, schema=$schema)"
            sleep 5
          done
          test "$health_ready" -eq 1
          echo "$health" | jq '{ok,d1Ready,schemaVersion,ownerFleetManagement,bookingCalendar,rentalLifecycle,paymentCheckout,paymentProviders}'

          providers=$(curl -fsS "$base/api/payments/providers")
          test "$(echo "$providers" | jq '.providers | length')" = "7"
          for provider in vietqr vnpay momo zalopay sbp yookassa tbank; do
            test "$(echo "$providers" | jq --arg p "$provider" 'any(.providers[]?; .id == $p)')" = "true"
          done

          vehicle_id="custom-stage5-payment-${GITHUB_RUN_ID}"
          contact="stage5-payment-${GITHUB_RUN_ID}"
          from=$(date -u -d '+40 days' +%F)
          to=$(date -u -d '+43 days' +%F)
          booking_id=''
          payment1_id=''
          payment2_id=''

          cleanup() {
            if [ -n "${booking_id:-}" ]; then
              npx wrangler d1 execute uniq-smart-rent-demo-db --remote --config wrangler-development.jsonc --command "DELETE FROM payment_events WHERE payment_id IN (SELECT id FROM payments WHERE booking_id='${booking_id}'); DELETE FROM transactions WHERE booking_id='${booking_id}'; DELETE FROM payments WHERE booking_id='${booking_id}'; DELETE FROM activity_log WHERE entity_id='${payment1_id}' OR entity_id='${payment2_id}' OR entity_id='${booking_id}'; DELETE FROM booking_extensions WHERE booking_id='${booking_id}'; DELETE FROM booking_status_history WHERE booking_id='${booking_id}'; DELETE FROM rentals WHERE booking_id='${booking_id}'; DELETE FROM bookings WHERE id='${booking_id}'; DELETE FROM customers WHERE contact='${contact}'; DELETE FROM activity_log WHERE entity_id='${vehicle_id}'; DELETE FROM vehicles WHERE id='${vehicle_id}';" >/dev/null 2>&1 || true
            else
              npx wrangler d1 execute uniq-smart-rent-demo-db --remote --config wrangler-development.jsonc --command "DELETE FROM customers WHERE contact='${contact}'; DELETE FROM activity_log WHERE entity_id='${vehicle_id}'; DELETE FROM vehicles WHERE id='${vehicle_id}';" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          vehicle_payload=$(jq -nc --arg id "$vehicle_id" '{id:$id,title:"Stage 5 Payment Scooter",type:"scooter",brand:"UNIQ",model:"Payment 125",year:2026,engine:"125 cc",dailyVnd:1000000,threeDayVnd:2800000,weeklyVnd:6000000,fourteenDayVnd:11000000,monthlyVnd:20000000,depositVnd:3000000,branchId:"branch-center",status:"ready",published:true,photos:[]}')
          vehicle=$(curl -fsS -X POST "$base/api/owner/fleet" -H 'content-type: application/json' -H 'x-uniq-demo-role: owner' --data "$vehicle_payload")
          test "$(echo "$vehicle" | jq -r '.persisted')" = "true"

          booking_payload=$(jq -nc --arg vehicleId "$vehicle_id" --arg from "$from" --arg to "$to" --arg contact "$contact" '{vehicleId:$vehicleId,from:$from,to:$to,client:"Stage 5 Payment Rider",contact:$contact,channel:"telegram",deliveryLocation:"branch-center"}')
          booking=$(curl -fsS -X POST "$base/api/bookings" -H 'content-type: application/json' --data "$booking_payload")
          booking_id=$(echo "$booking" | jq -r '.bookingId')
          total=$(echo "$booking" | jq -r '.estimatedTotalVnd')
          test -n "$booking_id"
          test "$total" -gt 0
          test "$(echo "$booking" | jq -r '.persisted')" = "true"

          intent1=$(curl -fsS -X POST "$base/api/payments/intents" -H 'content-type: application/json' --data "$(jq -nc --arg bookingId "$booking_id" '{bookingId:$bookingId,provider:"vietqr",prepaymentPercent:30}')")
          payment1_id=$(echo "$intent1" | jq -r '.payment.id')
          amount1=$(echo "$intent1" | jq -r '.payment.amountVnd')
          expected1=$(( (total * 30 + 99) / 100 ))
          test -n "$payment1_id"
          test "$amount1" -eq "$expected1"
          test "$(echo "$intent1" | jq -r '.payment.status')" = "pending"
          test "$(echo "$intent1" | jq -r '.payment.mode')" = "demo"
          test -n "$(echo "$intent1" | jq -r '.payment.qrPayload')"
          test -n "$(echo "$intent1" | jq -r '.payment.paymentReference')"

          paid1=$(curl -fsS -X POST "$base/api/payments/$payment1_id/demo-confirm")
          test "$(echo "$paid1" | jq -r '.status')" = "paid"
          test "$(echo "$paid1" | jq -r '.bookingPaymentStatus')" = "partially_paid"
          test "$(echo "$paid1" | jq -r '.bookingPaidVnd')" -eq "$amount1"

          idempotent=$(curl -fsS -X POST "$base/api/payments/$payment1_id/demo-confirm")
          test "$(echo "$idempotent" | jq -r '.status')" = "paid"
          test "$(echo "$idempotent" | jq -r '.idempotent')" = "true"

          intent2=$(curl -fsS -X POST "$base/api/payments/intents" -H 'content-type: application/json' --data "$(jq -nc --arg bookingId "$booking_id" '{bookingId:$bookingId,provider:"momo",prepaymentPercent:100}')")
          payment2_id=$(echo "$intent2" | jq -r '.payment.id')
          amount2=$(echo "$intent2" | jq -r '.payment.amountVnd')
          remainder=$(( total - amount1 ))
          test -n "$payment2_id"
          test "$amount2" -eq "$remainder"
          test "$(echo "$intent2" | jq -r '.payment.provider')" = "momo"

          paid2=$(curl -fsS -X POST "$base/api/payments/$payment2_id/demo-confirm")
          test "$(echo "$paid2" | jq -r '.bookingPaymentStatus')" = "paid"
          test "$(echo "$paid2" | jq -r '.bookingPaidVnd')" -eq "$total"

          payment_list=$(curl -fsS "$base/api/bookings/$booking_id/payments" -H 'x-uniq-demo-role: owner')
          test "$(echo "$payment_list" | jq '.payments | length')" -eq 2
          test "$(echo "$payment_list" | jq '[.payments[] | select(.status=="paid")] | length')" -eq 2

          audit=$(npx wrangler d1 execute uniq-smart-rent-demo-db --remote --config wrangler-development.jsonc --json --command "SELECT (SELECT COUNT(*) FROM transactions WHERE booking_id='${booking_id}' AND type='payment' AND status='completed') AS transactions_count, (SELECT COUNT(*) FROM payment_events WHERE payment_id IN (SELECT id FROM payments WHERE booking_id='${booking_id}')) AS payment_events_count, (SELECT paid_vnd FROM bookings WHERE id='${booking_id}') AS paid_vnd, (SELECT payment_status FROM bookings WHERE id='${booking_id}') AS payment_status;")
          test "$(echo "$audit" | jq -r '.[0].results[0].transactions_count')" -eq 2
          test "$(echo "$audit" | jq -r '.[0].results[0].payment_events_count')" -ge 4
          test "$(echo "$audit" | jq -r '.[0].results[0].paid_vnd')" -eq "$total"
          test "$(echo "$audit" | jq -r '.[0].results[0].payment_status')" = "paid"

          cleanup
          trap - EXIT
          echo 'Stage 5 live D1 payment flow verified: 30% VietQR + 70% MoMo balance + full payment + audit.'

# Primary development domain: https://uniq-smart-rent.viiversion.com
# Stage 5 payment checkout deploy: 2026-09-09
# Stage 5 D1-safe retry: 2026-09-09T04:05+07:00
