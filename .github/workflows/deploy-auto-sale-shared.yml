name: Deploy AUTO SALE USA via VIIVERSION

on:
  push:
    branches:
      - main
    paths:
      - '.deploy-auto-sale'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VIIVERSION_ZONE_ID: 56fa9423ef85e05559f453af43ec400f
      AUTO_DB_NAME: auto-sale-db
      AUTO_SERVICE: auto-sale-usa
      AUTO_HOSTNAME: auto-sale.viiversion.com

    steps:
      - name: Checkout AUTO SALE source
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/uniq-smart-rent
          ref: prototype/auto-sale-usa
          path: auto-sale

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install and validate
        working-directory: auto-sale
        run: |
          set -euo pipefail
          npm install
          npm run check

      - name: Resolve isolated AUTO SALE D1
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          list=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" "${auth[@]}")
          test "$(echo "$list" | jq -r '.success')" = "true"
          db_id=$(echo "$list" | jq -r --arg name "$AUTO_DB_NAME" '.result[] | select(.name == $name) | .uuid' | head -n1)
          if [ -z "$db_id" ] || [ "$db_id" = "null" ]; then
            created=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" -X POST "${auth[@]}" --data "{\"name\":\"${AUTO_DB_NAME}\"}")
            test "$(echo "$created" | jq -r '.success')" = "true"
            db_id=$(echo "$created" | jq -r '.result.uuid')
          fi
          test -n "$db_id"
          test "$db_id" != "null"
          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"

      - name: Prepare AUTO SALE Wrangler config
        working-directory: auto-sale
        env:
          AUTO_D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (!Array.isArray(cfg.d1_databases) || !cfg.d1_databases[0]) throw new Error('D1 binding missing');
          cfg.name = process.env.AUTO_SERVICE;
          cfg.d1_databases[0].database_name = process.env.AUTO_DB_NAME;
          cfg.d1_databases[0].database_id = process.env.AUTO_D1_DATABASE_ID;
          cfg.vars = { ...(cfg.vars || {}), PRODUCT_MODE: 'auto-sale-usa' };
          delete cfg.routes;
          fs.writeFileSync('wrangler.auto-sale.jsonc', JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Apply isolated D1 migrations
        working-directory: auto-sale
        run: npx wrangler d1 migrations apply "$AUTO_DB_NAME" --remote --config wrangler.auto-sale.jsonc

      - name: Deploy AUTO SALE Worker and assets
        working-directory: auto-sale
        run: npx wrangler deploy --config wrangler.auto-sale.jsonc

      - name: Attach AUTO SALE custom domain
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data "{\"hostname\":\"${AUTO_HOSTNAME}\",\"service\":\"${AUTO_SERVICE}\",\"zone_id\":\"${VIIVERSION_ZONE_ID}\",\"zone_name\":\"viiversion.com\"}")
          echo "$response" | jq .
          test "$(echo "$response" | jq -r '.success')" = "true"
          test "$(echo "$response" | jq -r '.result.hostname')" = "$AUTO_HOSTNAME"
          test "$(echo "$response" | jq -r '.result.service')" = "$AUTO_SERVICE"

      - name: Verify live AUTO SALE
        shell: bash
        run: |
          set -euo pipefail
          base="https://${AUTO_HOSTNAME}"
          ok=0
          for attempt in $(seq 1 24); do
            home_code=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/auto-sale-home.html -w '%{http_code}' "$base/?deploy=${GITHUB_SHA}" || true)
            if [ "$home_code" = "200" ] && grep -q 'AUTO SALE' /tmp/auto-sale-home.html; then
              echo "Verified live $base"
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

      - name: Verify responsive viewports
        shell: bash
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$chrome"
          for width in 360 390 430 768 1024; do
            echo "Checking viewport ${width}px"
            dom=$("$chrome" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=${width},1200 --virtual-time-budget=8000 --dump-dom "https://${AUTO_HOSTNAME}/?layoutAudit=1&width=${width}" 2>/dev/null)
            if ! echo "$dom" | grep -q 'LAYOUT_AUDIT_OK'; then
              echo "$dom" | grep -o 'LAYOUT_AUDIT_FAIL[^<]*' || true
              exit 1
            fi
          done
          echo "Responsive viewport audit passed"
