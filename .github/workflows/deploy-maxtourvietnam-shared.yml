name: Deploy maxtourvietnam shared runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.deploy-maxtourvietnam'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: 56fa9423ef85e05559f453af43ec400f
      CF_ZONE_NAME: viiversion.com
      TARGET_DOMAIN: maxtourvietnam.viiversion.com
      WORKER_NAME: maxtourvietnam
      DB_NAME: maxtourvietnam

    steps:
      - name: Checkout maxtourvietnam source
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/maxtourvietnam
          ref: main
          path: maxtourvietnam

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify shared Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo 'Shared Cloudflare credentials are available.'

      - name: Install dependencies
        working-directory: maxtourvietnam
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: Localize source media
        working-directory: maxtourvietnam
        shell: bash
        run: |
          set -euo pipefail
          npm run sync:media
          test -d public/mirror-media
          test "$(find public/mirror-media -type f | wc -l)" -gt 0
          ! grep -q 'tildacdn' seed/tours.sql
          grep -q '/mirror-media/' seed/tours.sql
          echo 'Source media localized into the deployment bundle and D1 seed.'

      - name: Build
        working-directory: maxtourvietnam
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Ensure D1 database and prepare deploy config
        working-directory: maxtourvietnam
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          list=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" "${auth[@]}")
          db_id=$(echo "$list" | jq -r --arg name "$DB_NAME" '.result[]? | select(.name == $name) | .uuid' | head -n1)

          if [ -z "$db_id" ] || [ "$db_id" = "null" ]; then
            created=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -X POST "${auth[@]}" --data "{\"name\":\"${DB_NAME}\"}")
            echo "$created" | jq '{success,result:{name:.result.name,uuid:.result.uuid},errors}'
            test "$(echo "$created" | jq -r '.success')" = "true"
            db_id=$(echo "$created" | jq -r '.result.uuid')
          fi

          test -n "$db_id"
          test "$db_id" != "null"
          jq --arg id "$db_id" --arg worker "$WORKER_NAME" \
            '.name = $worker | .d1_databases[0].database_id = $id' \
            wrangler.jsonc > wrangler.deploy.jsonc
          echo "D1 database ready: ${DB_NAME} (${db_id})"

      - name: Apply D1 migrations
        working-directory: maxtourvietnam
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc

      - name: Seed source-backed catalog
        working-directory: maxtourvietnam
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.deploy.jsonc --file=seed/tours.sql --yes
          catalog_check=$(npx wrangler d1 execute DB --remote --config wrangler.deploy.jsonc --command="SELECT COUNT(*) AS tours, SUM(CASE WHEN cover_image LIKE '%tildacdn%' THEN 1 ELSE 0 END) AS external_covers, SUM(CASE WHEN cover_image LIKE '/mirror-media/%' THEN 1 ELSE 0 END) AS local_covers FROM tours;" --json)
          echo "$catalog_check" | jq .
          echo "$catalog_check" | jq -e '.[0].results[0] | (.tours > 0) and (.external_covers == 0) and (.local_covers == .tours)' >/dev/null
          echo 'D1 catalog media integrity verified: all tour covers are local.'

      - name: Deploy Worker and React assets
        working-directory: maxtourvietnam
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.deploy.jsonc

      - name: Attach production custom domain
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data "{\"hostname\":\"${TARGET_DOMAIN}\",\"service\":\"${WORKER_NAME}\",\"zone_id\":\"${CF_ZONE_ID}\",\"zone_name\":\"${CF_ZONE_NAME}\"}")
          echo "$response" | jq '{success,result:{hostname:.result.hostname,service:.result.service,zone_name:.result.zone_name},errors}'
          test "$(echo "$response" | jq -r '.success')" = "true"
          test "$(echo "$response" | jq -r '.result.hostname')" = "$TARGET_DOMAIN"
          test "$(echo "$response" | jq -r '.result.service')" = "$WORKER_NAME"

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          ready=0
          for attempt in $(seq 1 30); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 15 -o /tmp/health.json -w '%{http_code}' "$base/api/health?smoke=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true and .project == "maxtourvietnam"' /tmp/health.json >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1
          curl -L -fsS --connect-timeout 5 --max-time 20 "$base/api/tours?smoke=${GITHUB_SHA}" -o /tmp/tours.json
          jq -e '.tours | length > 0' /tmp/tours.json >/dev/null
          ! grep -q 'tildacdn' /tmp/tours.json
          grep -q '/mirror-media/' /tmp/tours.json
          curl -L -fsS --connect-timeout 5 --max-time 20 "$base/" -o /tmp/home.html
          grep -q 'MAX TOUR Vietnam' /tmp/home.html
          echo 'maxtourvietnam production verified: Worker API, local D1 covers, and storefront are healthy.'
