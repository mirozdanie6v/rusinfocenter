name: Check Demo Studio Public

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/check-demo-studio-public.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEMO_STUDIO_PRODUCTION_HYBRID: ${{ vars.DEMO_STUDIO_PRODUCTION_HYBRID }}
    steps:
      - name: Checkout release marker
        uses: actions/checkout@v5

      - name: Inspect public root
        shell: bash
        run: |
          set -euo pipefail
          base="https://demostudio.viiversion.com"
          code=$(curl -L -sS --connect-timeout 8 --max-time 40             -D /tmp/root.headers             -o /tmp/root.body             -w '%{http_code}'             "${base}/?check=${GITHUB_SHA}")
          echo "HTTP=${code}"
          echo "--- headers ---"
          cat /tmp/root.headers
          echo "--- body preview ---"
          head -c 1200 /tmp/root.body
          echo
          echo "--- checks ---"
          test "${code}" = "200"
          grep -Fq 'VIIVERSION Demo Studio' /tmp/root.body
          grep -Fq 'Turn web apps into polished demo videos.' /tmp/root.body
          echo "Public root is valid."

      - name: Inspect health and release drift
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(awk -F= '/^release=/{print $2}' .deploy-demo-studio)
          hybrid="${DEMO_STUDIO_PRODUCTION_HYBRID:-true}"
          if [ "${hybrid}" = "false" ]; then
            expected_mode="standard"
          else
            expected_mode="hybrid"
          fi

          curl -fsS https://demostudio.viiversion.com/health > /tmp/demo-health.json
          jq . /tmp/demo-health.json
          jq -e --arg version "${expected_version}" --arg mode "${expected_mode}" '
            (.ok == true) and
            (.service == "viiversion-demo-studio") and
            (.version == $version) and
            (.generationMode == $mode)
          ' /tmp/demo-health.json >/dev/null

          echo "Production health matches release ${expected_version} in ${expected_mode} mode."
