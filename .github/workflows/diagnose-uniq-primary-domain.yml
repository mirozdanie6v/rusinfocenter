name: Diagnose UNIQ primary domain binding

on:
  push:
    branches:
      - ops/deploy-uniq-smart-rent-copy
    paths:
      - '.github/workflows/diagnose-uniq-primary-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Workers custom domain and DNS record
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '=== Workers custom domains ==='
          domains=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "$domains" | jq '{success, matches: [.result[]? | select(.hostname == "uniq-smart-rent.viiversion.com") | {id,hostname,service,environment,zone_id,zone_name}]}'
          echo '=== DNS records ==='
          dns=$(curl -fsS "https://api.cloudflare.com/client/v4/zones/56fa9423ef85e05559f453af43ec400f/dns_records?name=uniq-smart-rent.viiversion.com" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "$dns" | jq '{success, matches: [.result[]? | {id,type,name,content,proxied}]}'
