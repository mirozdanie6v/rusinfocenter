name: Audit LoveTravel live products

on:
  push:
    branches: [main]
    paths:
      - '.audit-love-products-live'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live Bókun product payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://lovetravel.viiversion.com/api/bokun/domain?locale=en&start=2026-09-30&end=2026-10-02&includePickupPlaces=1" > /tmp/domain.json
          jq '{
            domains:[.domains[]|{
              id:.experience.id,
              title:.experience.title,
              description:.experience.description,
              duration:.experience.duration,
              content:.experience.content,
              itinerary:.experience.itinerary,
              photos:[.experience.media.photos[]|{url,alt}],
              videos:.experience.media.videos,
              rates:[.rates[]|{id,title,description}],
              participants:.participants,
              extras:.extras,
              offers:.offers,
              questions:.bookingRequirements.questions,
              customFields:.bookingRequirements.customFields,
              meeting:.experience.meeting,
              pickup:.experience.pickup,
              cancellationPolicy:.cancellationPolicy,
              languages:.experience.languages
            }]
          }' /tmp/domain.json
