name: Cleanup MAX TOUR v28 smoke data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-max-tour-v28-smoke.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cleanup isolated D1 smoke session
        run: |
          set -euo pipefail
          printf '%s\n' '{"compatibility_date":"2026-09-09"}' > /tmp/wrangler-empty.jsonc
          npx wrangler d1 execute max-tour-standalone-v28-db --remote --config /tmp/wrangler-empty.jsonc --command "DELETE FROM favorites WHERE session_id IN (SELECT session_id FROM travelers WHERE full_name='Persistence Main'); DELETE FROM bookings WHERE id='persistence-smoke-v28'; DELETE FROM sessions WHERE id IN (SELECT session_id FROM travelers WHERE full_name='Persistence Main');"
          npx wrangler d1 execute max-tour-standalone-v28-db --remote --config /tmp/wrangler-empty.jsonc --json --command "SELECT COUNT(*) AS n FROM bookings WHERE id='persistence-smoke-v28';" > /tmp/check.json
          test "$(jq -r '.[0].results[0].n' /tmp/check.json)" = "0"
