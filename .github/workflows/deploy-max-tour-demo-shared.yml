name: Deploy MAX TOUR Demo via VIIVERSION

on:
  push:
    branches:
      - main
    paths:
      - '.deploy-max-tour-demo'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VIIVERSION_ZONE_ID: 56fa9423ef85e05559f453af43ec400f
      MAX_TOUR_DEMO_DB: max-tour-demo-v28-db
      MAX_TOUR_DEMO_SERVICE: max-tour-demo-v28
      MAX_TOUR_DEMO_HOST: max-tour-demo.viiversion.com

    steps:
      - name: Checkout MAX TOUR demo branch
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/MAX-TOUR
          ref: demo/max-tour-demo
          path: max-tour

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: max-tour/package-lock.json

      - name: Install, typecheck, test and build
        working-directory: max-tour
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build
          grep -Fq 'MAX TOUR' dist/client/index.html

      - name: Resolve dedicated MAX TOUR demo D1
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          list=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" "${auth[@]}")
          test "$(echo "$list" | jq -r '.success')" = "true"
          db_id=$(echo "$list" | jq -r --arg name "$MAX_TOUR_DEMO_DB" '.result[] | select(.name == $name) | .uuid' | head -n1)
          if [ -z "$db_id" ] || [ "$db_id" = "null" ]; then
            created=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" -X POST "${auth[@]}" --data "{\"name\":\"${MAX_TOUR_DEMO_DB}\"}")
            test "$(echo "$created" | jq -r '.success')" = "true"
            db_id=$(echo "$created" | jq -r '.result.uuid')
          fi
          test -n "$db_id"
          test "$db_id" != "null"
          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"

      - name: Prepare account-specific Wrangler config
        working-directory: max-tour
        env:
          DEMO_D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.demo.jsonc', 'utf8'));
          cfg.name = process.env.MAX_TOUR_DEMO_SERVICE;
          cfg.vars = {
            ...(cfg.vars || {}),
            TELEGRAM_MINIAPP_URL: `https://${process.env.MAX_TOUR_DEMO_HOST}`,
            AUTH_MODE: 'demo'
          };
          if (!Array.isArray(cfg.d1_databases) || !cfg.d1_databases[0]) throw new Error('D1 binding missing');
          cfg.d1_databases[0].database_name = process.env.MAX_TOUR_DEMO_DB;
          cfg.d1_databases[0].database_id = process.env.DEMO_D1_DATABASE_ID;
          delete cfg.routes;
          fs.writeFileSync('wrangler.viiversion-demo.jsonc', JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Apply D1 migrations
        working-directory: max-tour
        run: npx wrangler d1 migrations apply "$MAX_TOUR_DEMO_DB" --remote --config wrangler.viiversion-demo.jsonc

      - name: Seed verified MAX TOUR demo data
        working-directory: max-tour
        run: npx wrangler d1 execute "$MAX_TOUR_DEMO_DB" --remote --config wrangler.viiversion-demo.jsonc --file=seed/verified-max-tour-data.sql

      - name: Deploy MAX TOUR demo Worker and assets
        working-directory: max-tour
        run: npx wrangler deploy --config wrangler.viiversion-demo.jsonc

      - name: Attach MAX TOUR demo custom domain
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data "{\"hostname\":\"${MAX_TOUR_DEMO_HOST}\",\"service\":\"${MAX_TOUR_DEMO_SERVICE}\",\"zone_id\":\"${VIIVERSION_ZONE_ID}\",\"zone_name\":\"viiversion.com\"}")
          test "$(echo "$response" | jq -r '.success')" = "true"
          test "$(echo "$response" | jq -r '.result.hostname')" = "$MAX_TOUR_DEMO_HOST"
          test "$(echo "$response" | jq -r '.result.service')" = "$MAX_TOUR_DEMO_SERVICE"

      - name: Verify live MAX TOUR demo
        shell: bash
        run: |
          set -euo pipefail
          base="https://${MAX_TOUR_DEMO_HOST}"
          jar=/tmp/max-tour-demo-cookies.txt
          ok=0
          for attempt in $(seq 1 24); do
            home_code=$(curl -L -sS --connect-timeout 5 --max-time 25 -o /tmp/max-tour-home.html -w '%{http_code}' "$base/?deploy=${GITHUB_SHA}" || true)
            health_code=$(curl -L -sS --connect-timeout 5 --max-time 25 -o /tmp/max-tour-health.json -w '%{http_code}' "$base/api/health?deploy=${GITHUB_SHA}" || true)
            if [ "$home_code" = "200" ] && [ "$health_code" = "200" ] \
              && grep -Fq 'MAX TOUR' /tmp/max-tour-home.html \
              && [ "$(jq -r '.ok' /tmp/max-tour-health.json)" = "true" ] \
              && [ "$(jq -r '.database' /tmp/max-tour-health.json)" = "D1" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

          curl -L -fsS -c "$jar" -b "$jar" "$base/api/session" -o /tmp/max-tour-session.json
          jq -e '.ok == true and .demoSession == true' /tmp/max-tour-session.json >/dev/null

          curl -L -fsS -c "$jar" -b "$jar" "$base/api/tours" -o /tmp/max-tour-tours.json
          jq -e '.items | length >= 8' /tmp/max-tour-tours.json >/dev/null

          curl -L -fsS -c "$jar" -b "$jar" "$base/api/tours/dalat-premium/availability" -o /tmp/max-tour-availability.json
          date=$(jq -r '.items[0].date // empty' /tmp/max-tour-availability.json)
          test -n "$date"

          jq -n --arg date "$date" '{tourId:"dalat-premium",format:"group",date:$date,adults:2,children:[{height:112}],hotel:"Amiana Resort",transferZoneId:"north",participants:[{fullName:"Demo Main Traveler",birthDate:"1990-01-01"},{fullName:"Demo Companion",birthDate:"1992-02-02"},{fullName:"Demo Child",birthDate:"2020-03-03"}],contact:{name:"Demo Traveler",phone:"00000"},paymentChoice:"deposit",paymentMethod:"card",source:"Telegram"}' > /tmp/max-tour-quote-request.json
          curl -L -fsS -c "$jar" -b "$jar" -H 'Content-Type: application/json' --data-binary @/tmp/max-tour-quote-request.json "$base/api/booking/quote" -o /tmp/max-tour-quote.json
          jq -e '.quote.demo == true and .quote.totalMinor > 0 and .quote.payNowMinor > 0' /tmp/max-tour-quote.json >/dev/null

          echo "Verified live $base: Worker + assets + dedicated D1 + demo session + booking quote"
