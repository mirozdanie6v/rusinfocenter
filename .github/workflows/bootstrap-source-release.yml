name: Bootstrap RIC source release

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bootstrap-source-release.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      API_BASE: https://api.firestorage.ai/dev/file
      SHARE_ID: q2NTwI9cdnX8
      SOURCE_SHA256: f7bb87a668e9b791509d1929c5ab8bff43bb01f3831d9ea3b8c9a9345205db08
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download verified TypeScript source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundles
          curl -fsSL "$API_BASE/shares/$SHARE_ID/files?maxResults=100" -o /tmp/files.json
          id=$(jq -r '.files[] | select(.fileName == "source.tar.gz") | .fileId' /tmp/files.json | head -1)
          test -n "$id" && test "$id" != "null"
          curl -fsS -X POST "$API_BASE/shares/$SHARE_ID/files/$id/download" -o /tmp/download.json
          url=$(jq -r '.downloadUrl // .url // .download_url // empty' /tmp/download.json)
          test -n "$url"
          curl -fL --retry 3 --retry-delay 2 "$url" -o bundles/source.tar.gz
          test "$(stat -c%s bundles/source.tar.gz)" -eq 96037
          echo "$SOURCE_SHA256  bundles/source.tar.gz" | sha256sum -c -
          gzip -t bundles/source.tar.gz

      - name: Publish permanent GitHub source release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view source-v32 >/dev/null 2>&1; then
            gh release create source-v32 --title "RIC v32 TypeScript source" --notes "Verified generated TypeScript source archive for CI builds."
          fi
          gh release upload source-v32 bundles/source.tar.gz --clobber
          gh release view source-v32 --json url,assets
