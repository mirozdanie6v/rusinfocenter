name: MAX TOUR bundle probe

on:
  push:
    branches: [max-tour-deploy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect temporary bundle download implementation
        shell: bash
        run: |
          set -euo pipefail
          origin='https://firestorage.ai'
          chunk='/_next/static/chunks/4899-d89df949f2dbd5af.js'
          curl -L -sS "$origin$chunk" -o /tmp/js
          python3 - <<'PY'
          import re
          s=open('/tmp/js',encoding='utf-8').read()
          for pat in ['downloadUrl','download-url','/download','objects/','files/','shareId','publicId','fetch(','gT)(']:
              print('\n===== PATTERN',pat,'=====')
              matches=list(re.finditer(re.escape(pat),s,re.I))
              print('COUNT',len(matches))
              for m in matches[:30]:
                  print(s[max(0,m.start()-500):m.start()+1000].replace('\n',' ')[:1500])
          PY
