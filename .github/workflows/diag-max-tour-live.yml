name: Diagnose MAX TOUR live bundle

on:
  push:
    branches: [diag-max-tour-live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect live bundle
        shell: bash
        run: |
          set -u
          base='https://max-tour.viiversion.com'
          curl -L -sS -D /tmp/headers.txt "$base/" -o /tmp/home.html
          echo '--- STATUS / HEADERS ---'
          cat /tmp/headers.txt
          echo '--- LIVE HTML ---'
          sed -n '1,120p' /tmp/home.html
          echo '--- SCRIPT SOURCES ---'
          grep -oE 'src=["'"'"'][^"'"'"']+["'"'"']' /tmp/home.html || true
          echo '--- ASSET HREFS ---'
          grep -oE 'href=["'"'"'][^"'"'"']+["'"'"']' /tmp/home.html || true
