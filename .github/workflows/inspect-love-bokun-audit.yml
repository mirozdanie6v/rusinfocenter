name: Inspect LoveTravel Bókun audit

on:
  push:
    branches: [main]
    paths:
      - '.inspect-love-bokun-audit'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current Bókun domain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://lovetravel.viiversion.com/api/bokun/domain?locale=en&start=2026-09-30&end=2026-10-07&includePickupPlaces=0" > /tmp/domain.json
          jq '{
            domains:[.domains[]|{
              id:.experience.id,
              title:.experience.title,
              description:.experience.description,
              duration:.experience.duration,
              languages:.experience.languages,
              content:.experience.content,
              itinerary:.experience.itinerary,
              media:{
                photoCount:(.experience.media.photos|length),
                photos:[.experience.media.photos[]?|{url,alt}],
                videoCount:(.experience.media.videos|length),
                videos:.experience.media.videos
              },
              meeting:{type:.experience.meeting.type,startPoints:.experience.meeting.startPoints},
              pickup:{
                enabled:.experience.pickup.enabled,
                placeGroupCount:(.experience.pickup.placeGroups|length),
                placeCount:(.experience.pickup.places|length),
                customAllowed:.experience.pickup.customAllowed,
                noPickupMessage:.experience.pickup.noPickupMessage
              },
              accessibility:.experience.accessibility,
              rates:[.rates[]|{id,code,title,description}],
              extras:.extras,
              offers:.offers,
              participants:.participants,
              bookingRequirements:{
                questions:.bookingRequirements.questions,
                customFields:.bookingRequirements.customFields,
                requiredCustomerFields:.bookingRequirements.requiredCustomerFields,
                mainContactFields:.bookingRequirements.mainContactFields
              },
              cancellationPolicy:.cancellationPolicy,
              availabilityCount:(.availabilitySlots|length)
            }]
          }' /tmp/domain.json
