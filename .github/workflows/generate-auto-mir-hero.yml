name: Generate AUTO MIR hero via Cloudflare AI

on:
  push:
    branches:
      - ops/auto-mir-hero-gen
    paths:
      - '.generate-auto-mir-hero'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/auto-mir-hero-gen

      - name: Validate Cloudflare AI credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Generate hero image
        shell: bash
        run: |
          set -euo pipefail

          PROMPT='Create a high-end cinematic automotive website hero background in a dark luxury style. No people. No text, letters, numbers, logos, car emblems, license-plate text, icons, buttons, badges, interface elements or watermark. Three large realistic fabric banners flow diagonally from the upper-right toward the center: the upper banner has a dark blue canton with small white stars and alternating red and white stripes; the middle banner is white with one large red cross and four smaller red crosses; the lower banner has three horizontal bands, white on top, blue in the middle, red on the bottom. Background: subtle New York bridge and skyline on the far left, an old stone hilltop fortress and warm historic city in the center, modern glass skyscrapers on the right, seamlessly blended at dusk. Foreground on glossy wet black pavement: one large black unbranded premium luxury SUV in three-quarter front view, with one silver unbranded premium luxury sedan slightly behind on the right. Warm golden light trails sweep through the middle and connect the three city zones. Premium black, charcoal and gold palette, photorealistic automotive advertising, dramatic studio reflections, elegant realistic fabric, strong depth and atmospheric perspective. Keep the upper-left and left-center intentionally dark and visually calm for existing website copy. Keep the banners mostly upper-right, architecture in the middle, and cars in the lower-right/lower-center. Center all important visual content so responsive cropping works on mobile and desktop.'

          response=$(curl -sS -w '\n%{http_code}' \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-2-klein-9b" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --form "prompt=${PROMPT}" \
            --form "width=1536" \
            --form "height=1152" \
            --form "guidance=4.5" \
            --form "seed=251987")

          code=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          if [ "$code" != "200" ]; then
            echo "Cloudflare FLUX.2 klein 9B failed HTTP $code"
            echo "$body" | jq -c '{success,errors,messages}' || echo "$body"
            exit 1
          fi

          image_b64=$(printf '%s' "$body" | jq -r '.result.image // .image // empty')
          test -n "$image_b64"
          printf '%s' "$image_b64" | base64 -d > /tmp/auto-mir-hero.jpg

          file /tmp/auto-mir-hero.jpg
          test -s /tmp/auto-mir-hero.jpg
          mkdir -p generated
          base64 -w0 /tmp/auto-mir-hero.jpg > generated/auto-mir-hero.b64
          printf '%s\n' '@cf/black-forest-labs/flux-2-klein-9b' > generated/auto-mir-hero-model.txt

      - name: Save generated asset payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VIIVERSION Cloudflare AI"
          git config user.email "49186663+mirozdanie6v@users.noreply.github.com"
          git add generated/auto-mir-hero.b64 generated/auto-mir-hero-model.txt
          git commit -m "Generate AUTO MIR hero asset with Cloudflare AI" || exit 0
          git push origin HEAD:ops/auto-mir-hero-gen
