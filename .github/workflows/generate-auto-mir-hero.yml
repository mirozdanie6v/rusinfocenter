name: Generate AUTO MIR hero via Cloudflare AI

on:
  push:
    branches:
      - ops/auto-mir-hero-gen
    paths:
      - '.generate-auto-mir-hero'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/auto-mir-hero-gen

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image composer
        run: python -m pip install --quiet pillow

      - name: Validate Cloudflare AI credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Generate clean automotive scene
        shell: bash
        run: |
          set -euo pipefail

          PROMPT='Cinematic luxury automotive advertising hero, nightfall, premium dark black and champagne-gold color grade. A seamless international city panorama: a suspension bridge and dense waterfront skyline on the far left, a warm old stone city and hilltop fortress in the center, tall modern glass financial towers on the right. Foreground on wet reflective pavement: a large elegant black futuristic luxury SUV concept car in three-quarter front view, and a silver futuristic premium sedan behind it on the right. No people. No national flags or banners. No visible brand identity. Dark calm negative space in the upper-left and left-center for website copy. Warm gold light trails across the middle, expensive editorial automotive photography, realistic reflections, cinematic atmosphere, high detail, photorealistic.'
          NEGATIVE='text, letters, numbers, words, logo, emblem, badge, watermark, readable license plate, people, person, human, flags, national symbols, UI, button, icon, menu, distorted car, extra wheels, duplicate vehicle, warped architecture, low quality, cartoon'

          payload=$(jq -n --arg prompt "$PROMPT" --arg neg "$NEGATIVE" '{
            prompt:$prompt,
            negative_prompt:$neg,
            width:1536,
            height:1152,
            num_steps:8,
            guidance:7.0,
            seed:722401
          }')

          code=$(curl -sS -o /tmp/scene-response.bin -w '%{http_code}' \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/bytedance/stable-diffusion-xl-lightning" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload")

          if [ "$code" != "200" ]; then
            echo "Cloudflare SDXL scene generation failed HTTP $code"
            head -c 2000 /tmp/scene-response.bin || true
            exit 1
          fi

          if head -c 1 /tmp/scene-response.bin | grep -q '{'; then
            image_b64=$(jq -r '.result.image // .image // empty' /tmp/scene-response.bin)
            test -n "$image_b64"
            printf '%s' "$image_b64" | base64 -d > /tmp/auto-mir-scene.jpg
          else
            cp /tmp/scene-response.bin /tmp/auto-mir-scene.jpg
          fi

          file /tmp/auto-mir-scene.jpg
          test -s /tmp/auto-mir-scene.jpg

      - name: Compose exact three-flag ribbons
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from PIL import Image, ImageDraw, ImageFilter, ImageEnhance
          import math, os

          base=Image.open('/tmp/auto-mir-scene.jpg').convert('RGB').resize((1536,1152),Image.Resampling.LANCZOS)

          def flag_us(w=900,h=170):
              im=Image.new('RGB',(w,h),'white'); d=ImageDraw.Draw(im)
              red=(181,37,52); blue=(44,59,108)
              sh=h/13
              for i in range(13):
                  if i%2==0:d.rectangle((0,round(i*sh),w,round((i+1)*sh)),fill=red)
              cw,ch=int(w*.40),int(sh*7)
              d.rectangle((0,0,cw,ch),fill=blue)
              rows=9
              for r in range(rows):
                  n=6 if r%2==0 else 5
                  y=(r+.5)*ch/rows
                  for k in range(n):
                      x=(k+.5)*cw/n
                      rr=max(2,int(h*.008))
                      d.ellipse((x-rr,y-rr,x+rr,y+rr),fill='white')
              return im

          def flag_ge(w=900,h=170):
              im=Image.new('RGB',(w,h),'white'); d=ImageDraw.Draw(im); red=(205,40,45)
              vw=max(18,int(w*.035)); hh=max(16,int(h*.13))
              d.rectangle((w//2-vw//2,0,w//2+vw//2,h),fill=red)
              d.rectangle((0,h//2-hh//2,w,h//2+hh//2),fill=red)
              centers=[(w*.25,h*.25),(w*.75,h*.25),(w*.25,h*.75),(w*.75,h*.75)]
              for cx,cy in centers:
                  sw=max(7,int(w*.012)); sl=max(17,int(h*.18))
                  d.rectangle((cx-sw/2,cy-sl/2,cx+sw/2,cy+sl/2),fill=red)
                  d.rectangle((cx-sl,cy-sw/2,cx+sl,cy+sw/2),fill=red)
              return im

          def flag_ru(w=900,h=170):
              im=Image.new('RGB',(w,h),'white'); d=ImageDraw.Draw(im)
              d.rectangle((0,h/3,w,2*h/3),fill=(28,75,142))
              d.rectangle((0,2*h/3,w,h),fill=(190,45,55))
              return im

          def fabric(flag, amplitude=9, phase=0.0):
              flag=flag.convert('RGBA')
              w,h=flag.size
              out=Image.new('RGBA',(w,h+40),(0,0,0,0))
              # strip-wise wave + light/shadow modulation
              strip=10
              for x in range(0,w,strip):
                  sl=flag.crop((x,0,min(x+strip,w),h))
                  y=int(18 + math.sin(x/72+phase)*amplitude)
                  shade=.76 + .24*(math.sin(x/58+phase)+1)/2
                  sl=ImageEnhance.Brightness(sl).enhance(shade)
                  out.alpha_composite(sl,(x,y))
              return out

          def place(canvas, flag, center, angle, scale=1.0, opacity=238):
              f=fabric(flag,amplitude=10,phase=center[1]/70)
              if scale!=1:
                  f=f.resize((int(f.width*scale),int(f.height*scale)),Image.Resampling.LANCZOS)
              f.putalpha(f.getchannel('A').point(lambda p:int(p*opacity/255)))
              f=f.rotate(angle,resample=Image.Resampling.BICUBIC,expand=True)
              shadow=Image.new('RGBA',f.size,(0,0,0,0)); shadow.putalpha(f.getchannel('A'))
              shadow=shadow.filter(ImageFilter.GaussianBlur(14))
              x=int(center[0]-f.width/2); y=int(center[1]-f.height/2)
              canvas.alpha_composite(shadow,(x+8,y+14))
              canvas.alpha_composite(f,(x,y))

          canvas=base.convert('RGBA')

          # Subtle warm glow where ribbons cross the skyline.
          glow=Image.new('RGBA',canvas.size,(0,0,0,0))
          gd=ImageDraw.Draw(glow)
          gd.ellipse((690,120,1640,700),fill=(219,164,98,24))
          glow=glow.filter(ImageFilter.GaussianBlur(55))
          canvas=Image.alpha_composite(canvas,glow)

          # Three separate ribbons in the same order as the visual reference.
          place(canvas,flag_us(),center=(1160,205),angle=-18,scale=1.06,opacity=245)
          place(canvas,flag_ge(),center=(1205,350),angle=-15,scale=1.00,opacity=238)
          place(canvas,flag_ru(),center=(1240,500),angle=-12,scale=.96,opacity=235)

          # Dark left-side readability veil, preserving current UI positions.
          veil=Image.new('RGBA',canvas.size,(0,0,0,0)); px=veil.load()
          for x in range(900):
              a=int(150*(1-x/900)**1.7)
              for y in range(1152): px[x,y]=(4,7,10,a)
          canvas=Image.alpha_composite(canvas,veil)

          out=canvas.convert('RGB')
          out.save('/tmp/auto-mir-hero.jpg','JPEG',quality=88,optimize=True,progressive=True)
          print('final',out.size,os.path.getsize('/tmp/auto-mir-hero.jpg'))
          PY

          mkdir -p generated
          base64 -w0 /tmp/auto-mir-hero.jpg > generated/auto-mir-hero.b64
          printf '%s\n' 'Cloudflare FLUX.2 scene + deterministic 3-flag compositor' > generated/auto-mir-hero-model.txt

      - name: Save generated asset payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VIIVERSION Cloudflare AI"
          git config user.email "49186663+mirozdanie6v@users.noreply.github.com"
          git add generated/auto-mir-hero.b64 generated/auto-mir-hero-model.txt
          git commit -m "Generate composed AUTO MIR hero asset" || exit 0
          git push origin HEAD:ops/auto-mir-hero-gen
