name: Generate AUTO MIR hero via Cloudflare AI

on:
  push:
    branches:
      - ops/auto-mir-hero-gen
    paths:
      - '.generate-auto-mir-hero'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/auto-mir-hero-gen

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --quiet pillow

      - name: Validate Cloudflare AI credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Reconstruct exact visual reference
        shell: bash
        run: |
          set -euo pipefail
          cat ops/ref-parts/00.txt ops/ref-parts/01.txt ops/ref-parts/02.txt ops/ref-parts/03.txt ops/ref-parts/04.txt ops/ref-parts/05.txt > /tmp/reference.b64
          base64 -d /tmp/reference.b64 > /tmp/reference.jpg
          file /tmp/reference.jpg
          test -s /tmp/reference.jpg
          python <<'PY'
          from PIL import Image
          im=Image.open('/tmp/reference.jpg').convert('RGB')
          print('reference:', im.size)
          # Keep the full reference composition, only normalize it for img2img.
          target=(768,1365)
          im=im.resize(target,Image.Resampling.LANCZOS)
          im.save('/tmp/reference-normalized.jpg','JPEG',quality=94)
          print('normalized:',target)
          PY
          base64 -w0 /tmp/reference-normalized.jpg > /tmp/reference-normalized.b64

      - name: Rebuild clean hero from reference with Cloudflare SDXL
        shell: bash
        run: |
          set -euo pipefail

          PROMPT='Preserve the exact camera composition, relative object positions and visual hierarchy of the input reference image: large flowing United States flag in the upper-right, Georgian flag immediately below it, Russian tricolor below that; New York bridge and skyline at the left background, old Tbilisi hill and fortress in the center background, modern Moscow skyline at the right background; a large glossy black premium luxury SUV in the lower foreground and a silver premium luxury sedan slightly behind on the right. Reconstruct this as one clean full-bleed cinematic photographic automotive hero background. Remove the smartphone frame and every interface element completely. Remove and reconstruct over all typography, captions, logos, icons, menus, controls, cards, buttons and badges so only continuous photographic scenery remains beneath them. No people. Keep the same dark luxury black-and-champagne lighting, wet pavement reflections, warm gold light trails, realistic fabric flags, photorealistic architecture and premium automotive-advertising finish. Leave the upper-left and left-center darker and visually calm for website text overlay. Do not add any new writing or graphic symbols.'
          NEGATIVE='text, typography, letters, words, numbers, logo, watermark, brand emblem, badge, icon, button, menu, navigation, UI, interface, smartphone frame, phone bezel, status bar, card, caption, readable license plate, people, person, extra car, duplicate car, distorted wheels, deformed vehicle, merged flags, wrong flag pattern, cartoon, illustration, low quality'

          export PROMPT NEGATIVE
          python <<'PY'
          import json,os
          image=list(open('/tmp/reference.jpg','rb').read())
          payload={
            "prompt":os.environ["PROMPT"],
            "negative_prompt":os.environ["NEGATIVE"],
            "image":image,
            "width":768,
            "height":1344,
            "num_steps":20,
            "strength":0.38,
            "guidance":8.5,
            "seed":942731
          }
          with open('/tmp/img2img-payload.json','w') as fh:
              json.dump(payload,fh,separators=(',',':'))
          print("reference input bytes:",len(image))
          PY

          echo "img2img payload bytes: $(wc -c < /tmp/img2img-payload.json)"

          code=$(curl -sS -o /tmp/hero-response.bin -w '%{http_code}' \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/runwayml/stable-diffusion-v1-5-img2img" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/img2img-payload.json)

          if [ "$code" != "200" ]; then
            echo "Cloudflare dedicated img2img failed HTTP $code"
            head -c 3000 /tmp/hero-response.bin || true
            exit 1
          fi

          if head -c 1 /tmp/hero-response.bin | grep -q '{'; then
            image_b64=$(jq -r '.result.image // .image // empty' /tmp/hero-response.bin)
            test -n "$image_b64"
            printf '%s' "$image_b64" | base64 -d > /tmp/auto-mir-hero-raw.jpg
          else
            cp /tmp/hero-response.bin /tmp/auto-mir-hero-raw.jpg
          fi

          file /tmp/auto-mir-hero-raw.jpg
          test -s /tmp/auto-mir-hero-raw.jpg

      - name: Normalize production hero asset
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from PIL import Image,ImageEnhance,ImageDraw,ImageFilter
          import os
          im=Image.open('/tmp/auto-mir-hero-raw.jpg').convert('RGB')

          # Normalize to a high-quality portrait master close to the supplied reference.
          target=(1080,1440)
          src_ratio=im.width/im.height
          dst_ratio=target[0]/target[1]
          if src_ratio>dst_ratio:
              nw=int(im.height*dst_ratio)
              x=(im.width-nw)//2
              im=im.crop((x,0,x+nw,im.height))
          else:
              nh=int(im.width/dst_ratio)
              y=max(0,(im.height-nh)//2)
              im=im.crop((0,y,im.width,y+nh))
          im=im.resize(target,Image.Resampling.LANCZOS)

          # Maintain the dark luxury grade without changing composition.
          im=ImageEnhance.Contrast(im).enhance(1.05)
          im=ImageEnhance.Color(im).enhance(1.03)

          # Soft left readability veil only; no UI is baked into the image.
          rgba=im.convert('RGBA')
          veil=Image.new('RGBA',target,(0,0,0,0))
          px=veil.load()
          for x in range(target[0]):
              a=max(0,int(72*(1-x/target[0])**2.2))
              if a:
                  for y in range(target[1]):
                      px[x,y]=(4,7,10,a)
          rgba=Image.alpha_composite(rgba,veil)
          out=rgba.convert('RGB')
          out.save('/tmp/auto-mir-hero.jpg','JPEG',quality=88,optimize=True,progressive=True)
          print('production hero:',out.size,os.path.getsize('/tmp/auto-mir-hero.jpg'))
          PY

          mkdir -p generated
          base64 -w0 /tmp/auto-mir-hero.jpg > generated/auto-mir-hero.b64
          printf '%s\n' 'Cloudflare SDXL img2img from supplied AUTO MIR reference' > generated/auto-mir-hero-model.txt

      - name: Save generated asset payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VIIVERSION Cloudflare AI"
          git config user.email "49186663+mirozdanie6v@users.noreply.github.com"
          git add generated/auto-mir-hero.b64 generated/auto-mir-hero-model.txt
          git commit -m "Generate AUTO MIR hero from exact visual reference" || exit 0
          git push origin HEAD:ops/auto-mir-hero-gen
