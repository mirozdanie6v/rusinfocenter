name: Deploy MAX TOUR Standalone v28 via VIIVERSION

on:
  push:
    branches:
      - main
    paths:
      - '.deploy-max-tour-demo'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MAX_TOUR_DEMO_DB: max-tour-demo-v28-db
      MAX_TOUR_DEMO_SERVICE: max-tour-demo-v28
      MAX_TOUR_DEMO_HOST: max-tour-demo.viiversion.com

    steps:
      - name: Checkout MAX TOUR standalone v28
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/MAX-TOUR
          ref: demo/max-tour-demo
          path: max-tour

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify exact v28 source and build standalone app
        working-directory: max-tour/standalone-v28
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm test
          npm run build
          grep -Fq 'MaxTour Mini App Prototype v28' dist/index.html
          grep -Fq 'runtime-api.js' dist/index.html
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/catalog.v28.json','utf8')).length)")" = "15"

      - name: Resolve dedicated v28 D1 database
        id: d1
        working-directory: max-tour/standalone-v28
        run: |
          set -euo pipefail
          printf '%s\n' '{"compatibility_date":"2026-09-09"}' > /tmp/wrangler-empty.jsonc
          npx wrangler d1 list --json --config /tmp/wrangler-empty.jsonc > /tmp/max-tour-v28-d1.json
          db_id=$(jq -r --arg name "$MAX_TOUR_DEMO_DB" '.[] | select(.name == $name) | .uuid' /tmp/max-tour-v28-d1.json | head -n1)
          test -n "$db_id"
          test "$db_id" != "null"
          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"

      - name: Prepare account-specific standalone config
        working-directory: max-tour/standalone-v28
        env:
          DEMO_D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          cfg.name = process.env.MAX_TOUR_DEMO_SERVICE;
          cfg.vars = {
            ...(cfg.vars || {}),
            APP_ENV: 'demo-v28',
            APP_URL: `https://${process.env.MAX_TOUR_DEMO_HOST}`
          };
          if (!Array.isArray(cfg.d1_databases) || !cfg.d1_databases[0]) throw new Error('D1 binding missing');
          cfg.d1_databases[0].database_name = process.env.MAX_TOUR_DEMO_DB;
          cfg.d1_databases[0].database_id = process.env.DEMO_D1_DATABASE_ID;
          delete cfg.routes;
          fs.writeFileSync('wrangler.viiversion-demo.jsonc', JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Apply standalone v28 D1 migrations
        working-directory: max-tour/standalone-v28
        run: npx wrangler d1 migrations apply "$MAX_TOUR_DEMO_DB" --remote --config wrangler.viiversion-demo.jsonc

      - name: Deploy standalone v28 Worker and assets
        working-directory: max-tour/standalone-v28
        run: npx wrangler deploy --config wrangler.viiversion-demo.jsonc

      - name: Verify live exact v28 and D1
        run: |
          set -euo pipefail
          base="https://${MAX_TOUR_DEMO_HOST}"
          jar=/tmp/max-tour-v28-cookies.txt
          ok=0
          for attempt in $(seq 1 24); do
            home_code=$(curl -L -sS --connect-timeout 5 --max-time 25 -o /tmp/max-tour-v28-home.html -w '%{http_code}' "$base/?deploy=${GITHUB_SHA}" || true)
            health_code=$(curl -L -sS --connect-timeout 5 --max-time 25 -o /tmp/max-tour-v28-health.json -w '%{http_code}' "$base/api/health?deploy=${GITHUB_SHA}" || true)
            if [ "$home_code" = "200" ] && [ "$health_code" = "200" ] \
              && grep -Fq 'MaxTour Mini App Prototype v28' /tmp/max-tour-v28-home.html \
              && [ "$(jq -r '.ok' /tmp/max-tour-v28-health.json)" = "true" ] \
              && [ "$(jq -r '.app' /tmp/max-tour-v28-health.json)" = "max-tour-v28-standalone" ] \
              && [ "$(jq -r '.database' /tmp/max-tour-v28-health.json)" = "D1" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

          curl -L -fsS "$base/catalog.v28.json?deploy=${GITHUB_SHA}" -o /tmp/max-tour-v28-catalog.json
          jq -e 'length == 15 and any(.id == "dalat-premium")' /tmp/max-tour-v28-catalog.json >/dev/null

          curl -L -fsS -c "$jar" -b "$jar" "$base/api/bootstrap" -o /tmp/max-tour-v28-bootstrap.json
          jq -e '.ok == true and (.bookings|type) == "array" and (.travelers|type) == "array" and (.favorites|type) == "array"' /tmp/max-tour-v28-bootstrap.json >/dev/null

          echo "Verified live $base: exact v28 UI + 15-tour catalog + standalone Worker + dedicated D1"
