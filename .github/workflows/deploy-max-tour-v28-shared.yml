name: Deploy MAX TOUR Standalone v28 via VIIVERSION

on:
  push:
    branches:
      - main
    paths:
      - '.deploy-max-tour-demo'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VIIVERSION_ZONE_ID: 56fa9423ef85e05559f453af43ec400f
      MAX_TOUR_DEMO_DB: max-tour-standalone-v28-db
      MAX_TOUR_DEMO_SERVICE: max-tour-demo-v28
      MAX_TOUR_DEMO_HOST: max-tour-demo.viiversion.com

    steps:
      - name: Checkout standalone v28
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/MAX-TOUR
          ref: demo/max-tour-demo
          path: max-tour

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify and build standalone v28 only
        working-directory: max-tour/standalone-v28
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm test
          npm run build
          grep -Fq 'MaxTour Mini App Prototype v28' dist/index.html
          grep -Fq 'runtime-api.js' dist/index.html
          grep -Fq 'telegram.org/js/telegram-web-app.js?63' dist/index.html
          grep -Fq 'dashboard.viiversion.com/tracker.js' dist/index.html
          grep -Fq 'data-project="MAX TOUR Demo"' dist/index.html
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/catalog.v28.json','utf8')).length)")" = "15"

      - name: Resolve or create isolated D1
        id: d1
        working-directory: max-tour/standalone-v28
        run: |
          set -euo pipefail
          printf '%s\n' '{"compatibility_date":"2026-09-09"}' > /tmp/wrangler-empty.jsonc
          npx wrangler d1 list --json --config /tmp/wrangler-empty.jsonc > /tmp/d1.json
          db_id=$(jq -r --arg name "$MAX_TOUR_DEMO_DB" '.[] | select(.name == $name) | .uuid' /tmp/d1.json | head -n1)
          if [ -z "$db_id" ] || [ "$db_id" = "null" ]; then
            npx wrangler d1 create "$MAX_TOUR_DEMO_DB" --config /tmp/wrangler-empty.jsonc
            npx wrangler d1 list --json --config /tmp/wrangler-empty.jsonc > /tmp/d1.json
            db_id=$(jq -r --arg name "$MAX_TOUR_DEMO_DB" '.[] | select(.name == $name) | .uuid' /tmp/d1.json | head -n1)
          fi
          test -n "$db_id"
          test "$db_id" != "null"
          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"

      - name: Prepare standalone Cloudflare config
        working-directory: max-tour/standalone-v28
        env:
          DEMO_D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          cfg.name = process.env.MAX_TOUR_DEMO_SERVICE;
          cfg.vars = { ...(cfg.vars || {}), APP_ENV: 'demo-v28', APP_URL: `https://${process.env.MAX_TOUR_DEMO_HOST}` };
          cfg.d1_databases[0].database_name = process.env.MAX_TOUR_DEMO_DB;
          cfg.d1_databases[0].database_id = process.env.DEMO_D1_DATABASE_ID;
          delete cfg.routes;
          fs.writeFileSync('wrangler.viiversion-demo.jsonc', JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Apply clean standalone migrations
        working-directory: max-tour/standalone-v28
        run: npx wrangler d1 migrations apply "$MAX_TOUR_DEMO_DB" --remote --config wrangler.viiversion-demo.jsonc

      - name: Deploy standalone Worker and assets
        working-directory: max-tour/standalone-v28
        run: npx wrangler deploy --config wrangler.viiversion-demo.jsonc

      - name: Attach demo custom domain
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data "{\"hostname\":\"${MAX_TOUR_DEMO_HOST}\",\"service\":\"${MAX_TOUR_DEMO_SERVICE}\",\"zone_id\":\"${VIIVERSION_ZONE_ID}\",\"zone_name\":\"viiversion.com\"}")
          test "$(echo "$response" | jq -r '.success')" = "true"
          test "$(echo "$response" | jq -r '.result.hostname')" = "$MAX_TOUR_DEMO_HOST"
          test "$(echo "$response" | jq -r '.result.service')" = "$MAX_TOUR_DEMO_SERVICE"

      - name: Verify live standalone v28 and analytics
        run: |
          set -euo pipefail
          base="https://${MAX_TOUR_DEMO_HOST}"
          jar=/tmp/max-tour-v28-cookies.txt
          ok=0
          for attempt in $(seq 1 24); do
            home=$(curl -L -sS --connect-timeout 5 --max-time 25 -o /tmp/home.html -w '%{http_code}' "$base/?deploy=${GITHUB_SHA}" || true)
            health=$(curl -L -sS --connect-timeout 5 --max-time 25 -o /tmp/health.json -w '%{http_code}' "$base/api/health?deploy=${GITHUB_SHA}" || true)
            admin=$(curl -L -sS --connect-timeout 5 --max-time 25 -o /tmp/admin.html -w '%{http_code}' "$base/admin/?deploy=${GITHUB_SHA}" || true)
            director=$(curl -L -sS --connect-timeout 5 --max-time 25 -o /tmp/director.html -w '%{http_code}' "$base/director/?deploy=${GITHUB_SHA}" || true)
            logo=$(curl -L -sS --connect-timeout 5 --max-time 25 -o /tmp/max-tour-logo.svg -w '%{http_code}' "$base/max-tour-logo.svg?deploy=${GITHUB_SHA}" || true)
            if [ "$home" = "200" ] && [ "$health" = "200" ] && [ "$admin" = "200" ] && [ "$director" = "200" ] && [ "$logo" = "200" ] && grep -Fq 'MaxTour Mini App Prototype v28' /tmp/home.html && grep -Fq '/max-tour-logo.svg' /tmp/home.html && grep -Fq '/max-tour-logo.svg' /tmp/admin.html && grep -Fq '/max-tour-logo.svg' /tmp/director.html && grep -Fq '<svg' /tmp/max-tour-logo.svg && grep -Fq 'maxtourDirectorDrafts' /tmp/director.html && grep -Fq 'function searchIndex' /tmp/director.html && grep -Fq 'data-filter="period"' /tmp/director.html && grep -Fq 'id:"analytics", label:"Аналитика"' /tmp/director.html && grep -Fq 'Динамика выручки' /tmp/director.html && [ "$(jq -r '.app' /tmp/health.json)" = "max-tour-v28-standalone" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          grep -Fq 'telegram.org/js/telegram-web-app.js?63' /tmp/home.html
          grep -Fq 'dashboard.viiversion.com/tracker.js' /tmp/home.html
          grep -Fq 'data-project="MAX TOUR Demo"' /tmp/home.html
          grep -Fq 'sessionStorage' /tmp/director.html
          curl -L -fsS "$base/catalog.v28.json" -o /tmp/catalog.json
          jq -e 'length == 15 and any(.id == "dalat-premium")' /tmp/catalog.json >/dev/null
          curl -L -fsS -c "$jar" -b "$jar" "$base/api/bootstrap" -o /tmp/bootstrap.json
          jq -e '.ok == true and (.bookings|type) == "array" and (.travelers|type) == "array" and (.favorites|type) == "array"' /tmp/bootstrap.json >/dev/null
          echo "Verified live standalone MAX TOUR v28 with isolated D1 + Telegram analytics"
