name: Deploy MAX TOUR via shared Cloudflare credentials

on:
  workflow_dispatch:
  push:
    branches: [max-tour-deploy]
    paths:
      - '.deploy-max-tour'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: 56fa9423ef85e05559f453af43ec400f
      CF_ZONE_NAME: viiversion.com
      TARGET_DOMAIN: max-tour.viiversion.com
      WORKER_NAME: max-tour-demo

    steps:
      - name: Checkout MAX TOUR source
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/MAX-TOUR
          ref: main
          path: max-tour

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: max-tour/package-lock.json

      - name: Verify shared Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo 'Shared Cloudflare credentials are available.'

      - name: Install and verify MAX TOUR
        working-directory: max-tour
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Apply D1 migrations
        working-directory: max-tour
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Seed verified MAX TOUR baseline
        working-directory: max-tour
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --file=seed/verified-max-tour-data.sql --yes
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command='SELECT COUNT(*) AS tours FROM tours; SELECT COUNT(*) AS destinations FROM destinations;' --json

      - name: Deploy Worker and React assets
        working-directory: max-tour
        shell: bash
        run: |
          set -euo pipefail
          jq 'del(.routes)' wrangler.jsonc > /tmp/wrangler.deploy.json
          npx wrangler deploy --config /tmp/wrangler.deploy.json

      - name: Attach production custom domain
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data "{\"hostname\":\"${TARGET_DOMAIN}\",\"service\":\"${WORKER_NAME}\",\"zone_id\":\"${CF_ZONE_ID}\",\"zone_name\":\"${CF_ZONE_NAME}\"}")
          echo "$response" | jq '{success,result:{hostname:.result.hostname,service:.result.service,zone_name:.result.zone_name},errors}'
          test "$(echo "$response" | jq -r '.success')" = "true"
          test "$(echo "$response" | jq -r '.result.hostname')" = "$TARGET_DOMAIN"
          test "$(echo "$response" | jq -r '.result.service')" = "$WORKER_NAME"

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 15 -o /tmp/health.json -w '%{http_code}' "$base/api/health" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true and .service == "max-tour-demo" and .database == "D1"' /tmp/health.json >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1
          curl -L -fsS --connect-timeout 5 --max-time 20 "$base/" -o /tmp/home.html
          grep -q 'MAX TOUR' /tmp/home.html
          echo 'MAX TOUR production verified.'
