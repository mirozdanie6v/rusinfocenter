name: Fix UNIQ Stage 3 deploy gate
on:
  push:
    branches:
      - ops/deploy-uniq-smart-rent-copy
    paths:
      - '.stage3-deploy-gate-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/deploy-uniq-smart-rent-copy
      - name: Add API propagation retry
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-uniq-react-demo.yml')
          s=p.read_text()
          old='''          health=$(curl -fsS "$base/api/health")
          echo "$health" | jq '{ok,d1Ready,schemaVersion,ownerFleetManagement}'
'''
          new='''          health=''
          health_ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/uniq-health.json -w '%{http_code}' "$base/api/health" || true)
            if [ "$code" = "200" ]; then
              health=$(cat /tmp/uniq-health.json)
              if [ "$(echo "$health" | jq -r '.ok // false')" = "true" ]; then
                echo "API ready on attempt $attempt"
                health_ready=1
                break
              fi
            fi
            echo "API not ready yet (attempt $attempt, HTTP $code)"
            sleep 5
          done
          test "$health_ready" -eq 1
          echo "$health" | jq '{ok,d1Ready,schemaVersion,ownerFleetManagement}'
'''
          if old not in s:
              raise SystemExit('health smoke target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit deploy gate fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-uniq-react-demo.yml
          git commit -m 'Wait for UNIQ demo API propagation before CRUD smoke'
          git push origin HEAD:ops/deploy-uniq-smart-rent-copy
