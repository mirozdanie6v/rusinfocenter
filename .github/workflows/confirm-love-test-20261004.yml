name: Confirm one Love Travel test booking
on:
  push:
    branches: [main]
    paths: ['.github/workflows/confirm-love-test-20261004.yml']
permissions:
  contents: read
concurrency:
  group: love-travel-live-test
  cancel-in-progress: false
jobs:
  confirm:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/viiversion
          ref: 75362cfdfee4e6e3faabcf101ebb08e2dbfa057a
          path: viiversion
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test and deploy guarded booking lifecycle
        working-directory: viiversion/integration-service
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit
          npm run typecheck
          npm test
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc'));delete c.routes;fs.writeFileSync('wrangler.shared.jsonc',JSON.stringify(c));"
          npx wrangler deploy --dry-run --config wrangler.shared.jsonc
          npx wrangler deploy --config wrangler.shared.jsonc
      - name: Arm short-lived test access
        id: arm
        working-directory: viiversion/integration-service
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf '%s' "$token" | npx wrangler secret put BOKUN_BOOKING_TEST_TOKEN --config wrangler.shared.jsonc >/dev/null
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Read original test status
        env:
          BOOKING_TEST_TOKEN: ${{ steps.arm.outputs.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            status="$(curl -sS -o /tmp/old.json -w '%{http_code}' 'https://integration.viiversion.com/admin/bokun/pilot/booking?vendorId=137689&code=NHA-105381046' -H "x-viiversion-booking-test-token: $BOOKING_TEST_TOKEN")"
            if [ "$status" = 200 ]; then break; fi
            echo "Waiting for test-token deployment: HTTP $status"
            sleep 3
          done
          test "$status" = 200
          jq '{bookingId,confirmationCode,status,paymentStatus,externalBookingReference}' /tmp/old.json
      - name: Create one fresh reservation and confirm with zero payment
        env:
          BOOKING_TEST_TOKEN: ${{ steps.arm.outputs.token }}
        run: |
          set -euo pipefail
          base='https://integration.viiversion.com'
          vendor='137689'
          product='1287578'
          start='2026-10-07'
          end='2026-10-14'
          
          curl -fsS "$base/api/bokun/product?vendorId=$vendor&productId=$product" > /tmp/product.json
          curl -fsS "$base/api/bokun/availability?vendorId=$vendor&productId=$product&start=$start&end=$end&currency=USD" > /tmp/availability.json
          
          adult_category="$(jq -r '
            [
              .pricingCategories[]? |
              select(
                ((.ticketCategory // "") | ascii_upcase) == "ADULT"
                or ((.title // "") | ascii_downcase | contains("adult"))
              ) |
              .id
            ][0] // empty
          ' /tmp/product.json)"
          test -n "$adult_category"
          
          slot="$(jq -c --argjson cat "$adult_category" '
            [
              .[] |
              select(.soldOut != true and .unavailable != true) |
              . as $slot |
              [
                (.pricesByRate // [])[] |
                select(any(.pricePerCategoryUnit[]?; .id == $cat)) |
                {
                  slotId:$slot.id,
                  activityId:$slot.activityId,
                  startTimeId:$slot.startTimeId,
                  dateIso:($slot.id | capture("_(?<y>[0-9]{4})(?<m>[0-9]{2})(?<d>[0-9]{2})$") | "\(.y)-\(.m)-\(.d)"),
                  rateId:.activityRateId,
                  categoryId:$cat,
                  amount:([.pricePerCategoryUnit[]? | select(.id == $cat) | .amount][0] // null)
                }
              ][0]
            ] | map(select(. != null)) | .[0] // empty
          ' /tmp/availability.json)"
          test -n "$slot"
          echo "$slot" | jq .
          
          activity_id="$(jq -r '.activityId' <<<"$slot")"
          start_time_id="$(jq -r '.startTimeId' <<<"$slot")"
          date="$(jq -r '.dateIso' <<<"$slot")"
          rate_id="$(jq -r '.rateId' <<<"$slot")"
          category_id="$(jq -r '.categoryId' <<<"$slot")"
          
          jq -n             --argjson activityId "$activity_id"             --argjson rateId "$rate_id"             --argjson startTimeId "$start_time_id"             --argjson categoryId "$category_id"             --arg date "$date"             --arg ref "LT-TEST-CONFIRMED-${GITHUB_RUN_ID}"             '{
              mainContactDetails:[
                {questionId:"firstName",values:["VIIVERSION"]},
                {questionId:"lastName",values:["CONFIRMED TEST - DO NOT OPERATE"]},
                {questionId:"email",values:["booking-test@viiversion.com"]},
                {questionId:"phoneNumber",values:["+84900000000"]}
              ],
              activityBookings:[{
                activityId:$activityId,
                rateId:$rateId,
                startTimeId:$startTimeId,
                date:$date,
                pickup:false,
                dropoff:false,
                checkedIn:false,
                customized:false,
                passengers:[{pricingCategoryId:$categoryId}]
              }],
              sendCustomerNotification:false,
              externalBookingReference:$ref,
              externalBookingEntityName:"VIIVERSION",
              externalBookingEntityCode:"LOVE_TRAVEL"
            }' > /tmp/booking.json
          
          curl -fsS             -X POST "$base/api/bokun/checkout/options?vendorId=$vendor&currency=USD"             -H 'content-type: application/json'             --data-binary @/tmp/booking.json > /tmp/options.json
          
          option="$(jq -r '
            .options[]? |
            select((.paymentMethods.allowedMethods // []) | index("RESERVE_FOR_EXTERNAL_PAYMENT")) |
            .type
          ' /tmp/options.json | head -n1)"
          test -n "$option"
          
          
          jq --arg option "$option" '{checkoutOption:$option,paymentMethod:"RESERVE_FOR_EXTERNAL_PAYMENT",source:"DIRECT_REQUEST",directBooking:.,sendNotificationToMainContact:false,showPricesInNotification:false}' /tmp/booking.json > /tmp/checkout.json
          curl -fsS -X POST "$base/admin/bokun/checkout/submit-reserve?vendorId=$vendor&currency=USD" -H 'content-type: application/json' -H 'x-viiversion-booking-intent: RESERVE_REAL_BOKUN_BOOKING' -H "x-viiversion-booking-test-token: $BOOKING_TEST_TOKEN" --data-binary @/tmp/checkout.json > /tmp/reserve.json
          jq '{booking:.booking|{bookingId,confirmationCode,status,paymentType}}' /tmp/reserve.json
          code="$(jq -r '.booking.confirmationCode' /tmp/reserve.json)"
          test "$code" != null
          curl -fsS -X POST "$base/admin/bokun/pilot/confirm?vendorId=$vendor&code=$code" -H 'x-viiversion-booking-intent: CONFIRM_REAL_BOKUN_TEST_BOOKING' -H "x-viiversion-booking-test-token: $BOOKING_TEST_TOKEN" > /tmp/confirmed.json
          jq '{booking:.booking|{bookingId,confirmationCode,status,paymentType,totalPaid}}' /tmp/confirmed.json
          jq -e '.booking.status == "CONFIRMED" and .booking.totalPaid == 0' /tmp/confirmed.json
          curl -fsS "$base/admin/bokun/pilot/booking?vendorId=$vendor&code=$code" -H "x-viiversion-booking-test-token: $BOOKING_TEST_TOKEN" > /tmp/readback.json
          jq '{bookingId,confirmationCode,status,paymentStatus,externalBookingReference,customer:{firstName:.customer.firstName,lastName:.customer.lastName},productBookings:[.productBookings[]?|{productConfirmationCode,status,title,startDateTime}]}' /tmp/readback.json
          jq -e '.status == "CONFIRMED"' /tmp/readback.json
          
      - name: Disarm test access
        if: always()
        working-directory: viiversion/integration-service
        run: |
          printf 'y\n' | npx wrangler secret delete BOKUN_BOOKING_TEST_TOKEN --config wrangler.shared.jsonc
          for attempt in $(seq 1 20); do
            if curl -fsS 'https://integration.viiversion.com/api/bokun/status?vendorId=137689' | jq -e '.oneTimeBookingTestArmed == false and .realBookingWriteEnabled == false'; then exit 0; fi
            sleep 3
          done
          exit 1
