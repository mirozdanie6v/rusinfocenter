name: Confirm one Love Travel test booking
on:
  push:
    branches: [main]
    paths: ['.github/workflows/confirm-love-test-20261004.yml']
permissions:
  contents: read
concurrency:
  group: love-travel-live-test
  cancel-in-progress: false
jobs:
  confirm:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/viiversion
          ref: 8078c8a1dcf7c04f60b1e351039cbe76924b9f15
          path: viiversion
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test and deploy guarded booking lifecycle
        working-directory: viiversion/integration-service
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit
          npm run typecheck
          npm test
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc'));delete c.routes;fs.writeFileSync('wrangler.shared.jsonc',JSON.stringify(c));"
          npx wrangler deploy --dry-run --config wrangler.shared.jsonc
          npx wrangler deploy --config wrangler.shared.jsonc
      - name: Arm short-lived test access
        id: arm
        working-directory: viiversion/integration-service
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf '%s' "$token" | npx wrangler secret put BOKUN_BOOKING_TEST_TOKEN --config wrangler.shared.jsonc >/dev/null
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Read original test status
        env:
          BOOKING_TEST_TOKEN: ${{ steps.arm.outputs.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            status="$(curl -sS -o /tmp/old.json -w '%{http_code}' 'https://integration.viiversion.com/admin/bokun/pilot/booking?vendorId=137689&code=NHA-105381046' -H "x-viiversion-booking-test-token: $BOOKING_TEST_TOKEN")"
            if [ "$status" = 200 ]; then break; fi
            echo "Waiting for test-token deployment: HTTP $status"
            sleep 3
          done
          test "$status" = 200
          jq '{bookingId,confirmationCode,status,paymentStatus,externalBookingReference}' /tmp/old.json
      - name: Confirm existing fresh test without adding payment
        env:
          BOOKING_TEST_TOKEN: ${{ steps.arm.outputs.token }}
        run: |
          set -euo pipefail
          base='https://integration.viiversion.com'
          code='NHA-105698735'
          curl -fsS -X POST "$base/admin/bokun/pilot/confirm?vendorId=137689&code=$code" -H 'x-viiversion-booking-intent: CONFIRM_REAL_BOKUN_TEST_BOOKING' -H "x-viiversion-booking-test-token: $BOOKING_TEST_TOKEN" > /tmp/confirmed.json
          jq '{booking:.booking|{bookingId,confirmationCode,status,paymentType,totalPaid}}' /tmp/confirmed.json
          jq -e '.booking.status == "CONFIRMED"' /tmp/confirmed.json
          curl -fsS "$base/admin/bokun/pilot/booking?vendorId=137689&code=$code" -H "x-viiversion-booking-test-token: $BOOKING_TEST_TOKEN" > /tmp/readback.json
          jq '{bookingId,confirmationCode,status,paymentStatus,paymentType,totalPaid,externalBookingReference,customer:{firstName:.customer.firstName,lastName:.customer.lastName},productBookings:[.productBookings[]?|{productConfirmationCode,status,title,startDateTime}]}' /tmp/readback.json
          jq -e '.status == "CONFIRMED"' /tmp/readback.json
      - name: Disarm test access
        if: always()
        working-directory: viiversion/integration-service
        run: |
          printf 'y\n' | npx wrangler secret delete BOKUN_BOOKING_TEST_TOKEN --config wrangler.shared.jsonc
          for attempt in $(seq 1 20); do
            if curl -fsS 'https://integration.viiversion.com/api/bokun/status?vendorId=137689' | jq -e '.oneTimeBookingTestArmed == false and .realBookingWriteEnabled == false'; then exit 0; fi
            sleep 3
          done
          exit 1
