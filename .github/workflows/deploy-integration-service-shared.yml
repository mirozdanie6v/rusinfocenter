name: Deploy VIIVERSION Integration Service via RIC

on:
  push:
    branches:
      - main
    paths:
      - '.deploy-integration-service'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: 56fa9423ef85e05559f453af43ec400f
      CF_ZONE_NAME: viiversion.com
      TARGET_DOMAIN: integration.viiversion.com
      WORKER_NAME: viiversion-integration

    steps:
      - name: Checkout VIIVERSION integration service
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/viiversion
          ref: main
          path: viiversion

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify shared Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo 'RIC shared Cloudflare credentials are available.'

      - name: Install and verify integration service
        working-directory: viiversion/integration-service
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run

      - name: Prepare shared deployment config
        working-directory: viiversion/integration-service
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          cfg.name = process.env.WORKER_NAME;
          delete cfg.routes;
          fs.writeFileSync('wrangler.shared.jsonc', JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Deploy standalone integration Worker
        working-directory: viiversion/integration-service
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.shared.jsonc

      - name: List configured Worker secret names
        working-directory: viiversion/integration-service
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.shared.jsonc

      - name: Attach integration.viiversion.com
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data "{\"hostname\":\"${TARGET_DOMAIN}\",\"service\":\"${WORKER_NAME}\",\"zone_id\":\"${CF_ZONE_ID}\",\"zone_name\":\"${CF_ZONE_NAME}\"}")
          echo "$response" | jq '{success,result:{hostname:.result.hostname,service:.result.service,zone_name:.result.zone_name},errors}'
          test "$(echo "$response" | jq -r '.success')" = "true"
          test "$(echo "$response" | jq -r '.result.hostname')" = "${TARGET_DOMAIN}"
          test "$(echo "$response" | jq -r '.result.service')" = "${WORKER_NAME}"

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          ready=0
          for attempt in $(seq 1 30); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 15 -o /tmp/integration-health.json -w '%{http_code}' "$base/health?deploy=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true and .service == "viiversion-integration" and .bokun.vendorId == "137689" and .bokun.productId == "1287578"' /tmp/integration-health.json >/dev/null 2>&1; then
              ready=1
              break
            fi
            echo "integration.viiversion.com not ready yet (attempt $attempt, HTTP $code)"
            sleep 5
          done
          test "$ready" -eq 1
          echo 'VIIVERSION integration service production verified.'
