name: Deploy MAX TOUR demo two card photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.deploy-max-tour-demo-two-card-photos'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Inject photos into both live catalog cards
        shell: bash
        run: bash tools/hotfix-max-tour-demo-two-photos.sh
