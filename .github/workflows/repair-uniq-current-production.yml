name: Repair UNIQ current production

on:
  push:
    branches:
      - ops/deploy-uniq-smart-rent-copy
    paths:
      - '.github/workflows/repair-uniq-current-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@v5

      - name: Checkout pinned UNIQ build
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/uniq-smart-rent
          ref: 09840d9d32ee2834454809424365a433a92ebc2b
          path: uniq-smart-rent

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install and verify pinned build
        working-directory: uniq-smart-rent
        run: |
          set -euo pipefail
          npm install
          npm run check

      - name: Resolve D1 and write repair config
        working-directory: uniq-smart-rent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          list=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=uniq-smart-rent-db&per_page=100" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          test "$(echo "$list" | jq -r '.success')" = "true"
          db_id=$(echo "$list" | jq -r '.result[0].uuid // empty')
          test -n "$db_id"
          cat > wrangler-repair.jsonc <<EOF
          {
            "\$schema":"./node_modules/wrangler/config-schema.json",
            "name":"uniq-smart-rent",
            "main":"src/worker.ts",
            "compatibility_date":"2026-08-25",
            "workers_dev":true,
            "assets":{"directory":"./dist","binding":"ASSETS","not_found_handling":"single-page-application","run_worker_first":["/api/*"]},
            "d1_databases":[{"binding":"DB","database_name":"uniq-smart-rent-db","database_id":"${db_id}","migrations_dir":"migrations"}],
            "vars":{"DEMO_MODE":"true"},
            "observability":{"enabled":true}
          }
          EOF
          echo "Using D1: $db_id"

      - name: Apply remote migrations
        working-directory: uniq-smart-rent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply uniq-smart-rent-db --remote --config wrangler-repair.jsonc

      - name: Deploy pinned Worker and assets
        working-directory: uniq-smart-rent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler-repair.jsonc

      - name: Attach production domain
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" -X PUT -H 'Content-Type: application/json' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --data '{"hostname":"uniq-smart-rent.viiversion.com","service":"uniq-smart-rent","zone_id":"56fa9423ef85e05559f453af43ec400f","zone_name":"viiversion.com"}')
          test "$(echo "$response" | jq -r '.success')" = "true"
          test "$(echo "$response" | jq -r '.result.service')" = "uniq-smart-rent"

      - name: Verify Stage 12 health and analytics API
        shell: bash
        run: |
          set -euo pipefail
          base='https://uniq-smart-rent.viiversion.com'
          ready=0
          for attempt in $(seq 1 30); do
            health=$(curl -fsSL --connect-timeout 5 --max-time 15 "$base/api/health" 2>/dev/null || true)
            if [ -n "$health" ] && [ "$(echo "$health" | jq -r '.schemaVersion // 0' 2>/dev/null)" = "12" ] && [ "$(echo "$health" | jq -r '.ownerAnalytics // false' 2>/dev/null)" = "true" ] && [ "$(echo "$health" | jq -r '.dynamicBranches // false' 2>/dev/null)" = "true" ] && [ "$(echo "$health" | jq -r '.clientBookingExtension // false' 2>/dev/null)" = "true" ] && [ "$(echo "$health" | jq -r '.balancePayments // false' 2>/dev/null)" = "true" ] && [ "$(echo "$health" | jq -r '.overpaymentProtection // false' 2>/dev/null)" = "true" ] && [ "$(echo "$health" | jq -r '.fullOperationalFleet // false' 2>/dev/null)" = "true" ]; then
              analytics=$(curl -fsSL -H 'x-uniq-demo-role: owner' "$base/api/owner/analytics?period=7d&branch=all")
              test "$(echo "$analytics" | jq -r '.persisted')" = "true"
              ready=1
              break
            fi
            echo "Waiting for Stage 12 production propagation: $attempt"
            sleep 5
          done
          test "$ready" -eq 1

      - name: Browser gate — owner Analytics visible on mobile and desktop
        working-directory: uniq-smart-rent
        env:
          BASE_URL: https://uniq-smart-rent.viiversion.com
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node tests/owner_analytics_visibility.mjs
