name: Deploy LoveTravel via RIC

on:
  push:
    branches:
      - main
    paths:
      - '.deploy-love-travel'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: 56fa9423ef85e05559f453af43ec400f
      CF_ZONE_NAME: viiversion.com
      TARGET_DOMAIN: lovetravel.viiversion.com
      WORKER_NAME: love-travel-v28

    steps:
      - name: Checkout LoveTravel
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/LoveTravel-
          ref: main
          path: love-travel

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify shared Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "\${CLOUDFLARE_API_TOKEN:-}"
          test -n "\${CLOUDFLARE_ACCOUNT_ID:-}"
          echo 'RIC shared Cloudflare credentials are available.'

      - name: Install and verify LoveTravel
        working-directory: love-travel
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit
          npm run check
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy LoveTravel Worker
        working-directory: love-travel
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc

      - name: Attach lovetravel.viiversion.com
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/\${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer \${CLOUDFLARE_API_TOKEN}" \
            --data "{\"hostname\":\"\${TARGET_DOMAIN}\",\"service\":\"\${WORKER_NAME}\",\"zone_id\":\"\${CF_ZONE_ID}\",\"zone_name\":\"\${CF_ZONE_NAME}\"}")
          echo "$response" | jq '{success,result:{hostname:.result.hostname,service:.result.service,zone_name:.result.zone_name},errors}'
          test "$(echo "$response" | jq -r '.success')" = "true"

      - name: Production Bókun smoke
        shell: bash
        run: |
          set -euo pipefail
          base="https://\${TARGET_DOMAIN}"
          ready=0
          for attempt in $(seq 1 30); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 30 \
              -o /tmp/lovetravel-bokun.json -w '%{http_code}' \
              "$base/api/bokun/tours?start=2026-09-28&end=2026-10-02&deploy=\${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] && jq -e '
              .ok == true and
              .source == "bokun" and
              .mode == "read-only" and
              .vendorId == "137689" and
              (.productIds == ["1287578","1287580"]) and
              (.tours | length == 2) and
              ([.tours[].id] == ["1287578","1287580"])
            ' /tmp/lovetravel-bokun.json >/dev/null 2>&1; then
              ready=1
              break
            fi
            echo "LoveTravel Bókun endpoint not ready yet (attempt $attempt, HTTP $code)"
            sleep 5
          done
          test "$ready" -eq 1
          jq '{ok,source,mode,vendorId,productIds,tours:[.tours[]|{id,title,image,photos:(.gallery|length),from:.group.from,departures:(.group.departures|length)}]}' /tmp/lovetravel-bokun.json
