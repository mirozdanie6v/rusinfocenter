name: Patch RIC navigation source release

on:
  push:
    paths:
      - .github/workflows/patch-nav-source-release.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Download and verify source-v32
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundles
          gh release download source-v32 --repo "${{ github.repository }}" --pattern 'source.tar.gz' --dir bundles
          test "$(stat -c%s bundles/source.tar.gz)" -eq 96037
          echo 'f7bb87a668e9b791509d1929c5ab8bff43bb01f3831d9ea3b8c9a9345205db08  bundles/source.tar.gz' | sha256sum -c -
          gzip -t bundles/source.tar.gz

      - name: Patch current header and bottom navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import copy
          import io
          import re
          import tarfile

          src = Path('bundles/source.tar.gz')
          out = Path('bundles/source-v33.tar.gz')

          with tarfile.open(src, 'r:gz') as tf:
              members = tf.getmembers()
              pages_candidates = [m for m in members if m.isfile() and m.name.endswith('src/generated/pages.ts')]
              css_candidates = [m for m in members if m.isfile() and m.name.endswith('src/styles.css')]
              if len(pages_candidates) != 1 or len(css_candidates) != 1:
                  raise SystemExit(f'Expected one pages.ts/styles.css, got {len(pages_candidates)}/{len(css_candidates)}')
              pages_name = pages_candidates[0].name
              css_name = css_candidates[0].name
              payloads = {}
              for m in members:
                  if m.isfile():
                      f = tf.extractfile(m)
                      payloads[m.name] = f.read() if f else b''

          pages = payloads[pages_name].decode('utf-8')
          css = payloads[css_name].decode('utf-8')

          pages, menu_count = re.subn(r'<span[^>]*header-menu-text[^>]*>Меню</span>', '', pages)
          if menu_count < 1:
              raise SystemExit('Current header-menu-text label not found')
          if re.search(r'<span[^>]*header-menu-text[^>]*>Меню</span>', pages):
              raise SystemExit('Visible header menu label remains')

          pages, aria_count = re.subn(
              r'(<button[^>]*class=\\+"header-menu-trigger\\+"[^>]*)(>)',
              lambda m: m.group(1) + (' aria-label=\\"Открыть навигацию\\"' if 'aria-label=' not in m.group(1) else '') + m.group(2),
              pages,
          )

          marker = '/* v33 navigation alignment: icon-only header menu + centered bottom labels */'
          override = "\n".join([
              '',
              marker,
              '.header-menu-text{',
              '  display:none!important;',
              '}',
              '.header-menu-trigger{',
              '  width:var(--control-h,44px)!important;',
              '  min-width:var(--control-h,44px)!important;',
              '  height:var(--control-h,44px)!important;',
              '  min-height:var(--control-h,44px)!important;',
              '  padding:0!important;',
              '  gap:0!important;',
              '  display:inline-flex!important;',
              '  align-items:center!important;',
              '  justify-content:center!important;',
              '}',
              '.header-menu-trigger .ui-icon.ui-icon-menu{',
              '  margin:0!important;',
              '  flex:0 0 auto!important;',
              '}',
              '.bottom-nav .nav-button{',
              '  text-align:center!important;',
              '}',
              '.bottom-nav .nav-button > span:last-child{',
              '  display:block!important;',
              '  width:100%!important;',
              '  margin-left:auto!important;',
              '  margin-right:auto!important;',
              '  text-align:center!important;',
              '}',
              '',
          ])
          if marker in css:
              raise SystemExit('v33 navigation override already exists in source-v32 unexpectedly')
          css = css.rstrip() + override

          tail = css[css.rfind(marker):]
          for item in [
              '.header-menu-trigger{',
              'padding:0!important;',
              'justify-content:center!important;',
              '.bottom-nav .nav-button > span:last-child{',
              'width:100%!important;',
              'text-align:center!important;',
          ]:
              if item not in tail:
                  raise SystemExit(f'Missing final navigation rule: {item}')

          payloads[pages_name] = pages.encode('utf-8')
          payloads[css_name] = css.encode('utf-8')

          with tarfile.open(out, 'w:gz') as tf_out:
              for member in members:
                  info = copy.copy(member)
                  if member.isfile():
                      data = payloads[member.name]
                      info.size = len(data)
                      tf_out.addfile(info, io.BytesIO(data))
                  else:
                      tf_out.addfile(info)

          print(f'Removed visible Меню label from {menu_count} generated page definitions.')
          print(f'Accessible header trigger matches: {aria_count}.')
          print('Header hamburger forced to exact center of square control.')
          print('Bottom navigation captions forced to full-width centered alignment.')
          PY

          gzip -t bundles/source-v33.tar.gz
          tar -tzf bundles/source-v33.tar.gz >/dev/null

      - name: Publish source-v33
        shell: bash
        run: |
          set -euo pipefail
          mv bundles/source-v33.tar.gz /tmp/source-v33.tar.gz
          rm -f bundles/source.tar.gz
          cp /tmp/source-v33.tar.gz bundles/source.tar.gz
          gzip -t bundles/source.tar.gz
          echo "SOURCE_V33_SIZE=$(stat -c%s bundles/source.tar.gz)"
          echo "SOURCE_V33_SHA256=$(sha256sum bundles/source.tar.gz | awk '{print $1}')"
          if ! gh release view source-v33 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create source-v33 --repo "${{ github.repository }}" --title "RIC v33 TypeScript source" --notes "Header menu is icon-only and centered; bottom navigation captions are centered."
          fi
          gh release upload source-v33 bundles/source.tar.gz --repo "${{ github.repository }}" --clobber
          gh release view source-v33 --repo "${{ github.repository }}" --json url,assets
