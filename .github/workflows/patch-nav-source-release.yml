name: Patch RIC navigation source release

on:
  push:
    paths:
      - .github/workflows/patch-nav-source-release.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Download and verify source-v32
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundles
          gh release download source-v32 --repo "${{ github.repository }}" --pattern 'source.tar.gz' --dir bundles
          test "$(stat -c%s bundles/source.tar.gz)" -eq 96037
          echo 'f7bb87a668e9b791509d1929c5ab8bff43bb01f3831d9ea3b8c9a9345205db08  bundles/source.tar.gz' | sha256sum -c -
          gzip -t bundles/source.tar.gz

      - name: Apply navigation alignment changes inside archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import copy
          import io
          import re
          import tarfile

          src = Path('bundles/source.tar.gz')
          out = Path('bundles/source-v33.tar.gz')

          with tarfile.open(src, 'r:gz') as tf:
              members = tf.getmembers()
              names = [m.name for m in members]
              print('Archive members:')
              for name in names:
                  print(name)

              app_candidates = [m for m in members if m.isfile() and m.name.endswith('src/App.tsx')]
              css_candidates = [m for m in members if m.isfile() and m.name.endswith('src/styles.css')]
              if len(app_candidates) != 1 or len(css_candidates) != 1:
                  raise SystemExit(f'Expected one App.tsx/styles.css, got {len(app_candidates)}/{len(css_candidates)}')
              app_name = app_candidates[0].name
              css_name = css_candidates[0].name

              payloads = {}
              for m in members:
                  if m.isfile():
                      f = tf.extractfile(m)
                      payloads[m.name] = f.read() if f else b''

          app = payloads[app_name].decode('utf-8')
          css = payloads[css_name].decode('utf-8')

          # Visible word removed; button remains accessible to screen readers.
          pattern = re.compile(
              r'(<button className="menu-pill" id="menuBtn" type="button" onClick=\{openMenu\})>\s*<span>Меню</span>\s*(<span className="hamb" aria-hidden="true">)',
              re.M,
          )
          app, n = pattern.subn(r'\1 aria-label="Меню" title="Меню">\n              \2', app, count=1)
          if n != 1 or '<span>Меню</span>' in app:
              raise SystemExit(f'Menu label replacement failed: replacements={n}')

          # Base menu button: same square footprint as the search button; hamburger centered.
          menu_block = re.compile(r'(\.menu-pill\s*\{)(.*?)(\n\})', re.S)
          match = menu_block.search(css)
          if not match:
              raise SystemExit('Base .menu-pill block not found')
          body = match.group(2)
          for old, new in [
              ('min-width: 100px;', 'min-width: 42px;\n  width: 42px;'),
              ('padding: 0 15px;', 'padding: 0;'),
              ('justify-content: space-between;', 'justify-content: center;'),
              ('gap: 10px;', 'gap: 0;'),
          ]:
              if old not in body:
                  raise SystemExit(f'Missing base menu CSS: {old}')
              body = body.replace(old, new, 1)
          css = css[:match.start()] + match.group(1) + body + match.group(3) + css[match.end():]

          # Bottom navigation captions get the full item width and explicit centering.
          label_block = re.compile(r'(\.mobile-link b\s*\{)(.*?)(\n\})', re.S)
          match = label_block.search(css)
          if not match:
              raise SystemExit('.mobile-link b block not found')
          body = match.group(2)
          if 'width: 100%;' not in body:
              body += '\n  width: 100%;'
          if 'text-align:' in body:
              body = re.sub(r'text-align:\s*[^;]+;', 'text-align: center;', body, count=1)
          else:
              body += '\n  text-align: center;'
          css = css[:match.start()] + match.group(1) + body + match.group(3) + css[match.end():]

          # Mobile breakpoint previously restored side padding. Keep a true centered 40x40 button.
          old_mobile = '.menu-pill { min-width: auto; height: 40px; padding: 0 12px; }'
          new_mobile = '.menu-pill { min-width: 40px; width: 40px; height: 40px; padding: 0; justify-content: center; }'
          if old_mobile not in css:
              raise SystemExit('Mobile .menu-pill override not found')
          css = css.replace(old_mobile, new_mobile, 1)

          payloads[app_name] = app.encode('utf-8')
          payloads[css_name] = css.encode('utf-8')

          with tarfile.open(out, 'w:gz') as tf_out:
              with tarfile.open(src, 'r:gz') as tf_in:
                  for member in tf_in.getmembers():
                      info = copy.copy(member)
                      if member.isfile():
                          data = payloads[member.name]
                          info.size = len(data)
                          tf_out.addfile(info, io.BytesIO(data))
                      else:
                          tf_out.addfile(info)

          print('\n=== APP CHECK ===')
          for line in app.splitlines():
              if 'id="menuBtn"' in line or 'className="hamb"' in line:
                  print(line)
          print('\n=== CSS CHECK ===')
          base = menu_block.search(css)
          print((base.group(1) + base.group(2) + base.group(3)) if base else 'missing')
          label = label_block.search(css)
          print((label.group(1) + label.group(2) + label.group(3)) if label else 'missing')
          print(new_mobile)
          PY

          mv bundles/source-v33.tar.gz bundles/source-patched.tar.gz
          gzip -t bundles/source-patched.tar.gz

      - name: Publish source-v33
        shell: bash
        run: |
          set -euo pipefail
          mv bundles/source-patched.tar.gz bundles/source.tar.gz.new
          mv bundles/source.tar.gz.new /tmp/source-v33.tar.gz
          rm -f bundles/source.tar.gz
          cp /tmp/source-v33.tar.gz bundles/source.tar.gz
          gzip -t bundles/source.tar.gz
          echo "SOURCE_V33_SIZE=$(stat -c%s bundles/source.tar.gz)"
          echo "SOURCE_V33_SHA256=$(sha256sum bundles/source.tar.gz | awk '{print $1}')"
          if ! gh release view source-v33 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create source-v33 --repo "${{ github.repository }}" --title "RIC v33 TypeScript source" --notes "Navigation alignment: icon-only centered menu button and centered bottom navigation captions."
          fi
          gh release upload source-v33 bundles/source.tar.gz --repo "${{ github.repository }}" --clobber
          gh release view source-v33 --repo "${{ github.repository }}" --json url,assets
