name: Deploy LoveTravel via RIC

on:
  push:
    branches:
      - main
    paths:
      - '.deploy-lovetravel'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lovetravel-v28-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: 56fa9423ef85e05559f453af43ec400f
      CF_ZONE_NAME: viiversion.com
      TARGET_DOMAIN: lovetravel.viiversion.com
      WORKER_NAME: love-travel-v28

    steps:
      - name: Checkout RIC status repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record LoveTravel shared deploy start
        shell: bash
        run: |
          set -euo pipefail
          cat > .lovetravel-shared-status.json <<EOF
          {
            "stage": "running",
            "workflowRunId": "$GITHUB_RUN_ID",
            "triggerCommit": "$GITHUB_SHA"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .lovetravel-shared-status.json
          git commit -m "Record LoveTravel shared deploy start"
          git push origin HEAD:main

      - name: Checkout LoveTravel
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/LoveTravel-
          ref: main
          path: LoveTravel

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify shared Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo 'RIC shared Cloudflare credentials are available.'

      - name: Install and verify LoveTravel
        working-directory: LoveTravel
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy LoveTravel Worker and assets
        working-directory: LoveTravel
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc

      - name: Attach lovetravel.viiversion.com
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"             -X PUT             -H 'Content-Type: application/json'             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             --data "{\"hostname\":\"${TARGET_DOMAIN}\",\"service\":\"${WORKER_NAME}\",\"zone_id\":\"${CF_ZONE_ID}\",\"zone_name\":\"${CF_ZONE_NAME}\"}")
          echo "$response" | jq '{success,result:{hostname:.result.hostname,service:.result.service,zone_name:.result.zone_name},errors}'
          test "$(echo "$response" | jq -r '.success')" = "true"
          test "$(echo "$response" | jq -r '.result.hostname')" = "${TARGET_DOMAIN}"
          test "$(echo "$response" | jq -r '.result.service')" = "${WORKER_NAME}"

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          ready=0
          for attempt in $(seq 1 30); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/home.html -w '%{http_code}' "$base/?deploy=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] && grep -q 'Nha Trang Love Travel' /tmp/home.html && grep -q 'lovetravel-shell.js' /tmp/home.html && ! grep -qi 'MAX TOUR' /tmp/home.html; then
              ready=1
              break
            fi
            echo "LoveTravel first paint not ready yet (attempt $attempt, HTTP $code)"
            sleep 5
          done
          test "$ready" -eq 1

          curl -L -fsS --retry 8 --retry-delay 3 --connect-timeout 8 --max-time 60 "$base/api/bokun/tours?start=2026-09-29&end=2026-10-05" -o /tmp/tours.json
          jq -e '.ok == true and .source == "bokun" and (.productIds | sort) == ["1287578","1287580"] and (.tours | length) == 2' /tmp/tours.json >/dev/null

          curl -L -fsS --retry 8 --retry-delay 3 --connect-timeout 8 --max-time 60 "$base/api/bokun/domain?start=2026-09-29&end=2026-10-05" -o /tmp/domain.json
          jq -e '.ok == true and .source == "bokun" and (.domains | length) == 2' /tmp/domain.json >/dev/null

          grep -q 'lovetravel-runtime.js' /tmp/home.html
          grep -q 'lovetravel-domain-tour.js' /tmp/home.html
          grep -q 'lovetravel-booking-configurator.js' /tmp/home.html
          ! grep -qi 'catalog.v28' /tmp/home.html
          echo 'LoveTravel production verified.'

      - name: Record final shared deployment status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          status="${{ job.status }}"
          cat > .lovetravel-shared-status.json <<EOF
          {
            "stage": "$status",
            "workflowRunId": "$GITHUB_RUN_ID",
            "triggerCommit": "$GITHUB_SHA",
            "domain": "https://lovetravel.viiversion.com",
            "worker": "love-travel-v28"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .lovetravel-shared-status.json
          git commit -m "Record LoveTravel shared deploy status" || true
          git push origin HEAD:main || true
