name: Import THE CLOUD package

on:
  push:
    branches:
      - the-cloud
    paths:
      - '.deploy-the-cloud-import'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: the-cloud
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install browser helper
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Download uploaded deployment package
        env:
          SHARE_URL: https://firestorage.ai/en/f/MEPr8n6dJHpY
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ acceptDownloads: true });
            const out = '/tmp/thecloud.zip';

            async function saveDirect(url) {
              const resp = await page.request.get(url, { timeout: 30000 });
              if (!resp.ok()) return false;
              const body = await resp.body();
              if (body.length < 1000) return false;
              fs.writeFileSync(out, body);
              return true;
            }

            await page.goto(process.env.SHARE_URL, { waitUntil: 'networkidle', timeout: 60000 });

            for (let round = 0; round < 4 && !fs.existsSync(out); round++) {
              const links = await page.locator('a').evaluateAll(as => as.map(a => ({
                href: a.href || '',
                text: (a.innerText || '').trim(),
                download: a.getAttribute('download') || ''
              })));

              const direct = links.find(x => /\.zip(?:[?#]|$)/i.test(x.href));
              if (direct && await saveDirect(direct.href)) break;

              const selectors = [
                'a:has-text("thecloud-clean-deploy.zip")',
                'button:has-text("thecloud-clean-deploy.zip")',
                'a:has-text("Download")',
                'button:has-text("Download")',
                'a:has-text("ダウンロード")',
                'button:has-text("ダウンロード")'
              ];

              let clicked = false;
              for (const sel of selectors) {
                const loc = page.locator(sel).first();
                if (await loc.count()) {
                  try {
                    const dlPromise = page.waitForEvent('download', { timeout: 12000 }).catch(() => null);
                    await loc.click({ timeout: 10000 });
                    const dl = await dlPromise;
                    if (dl) {
                      await dl.saveAs(out);
                      clicked = true;
                      break;
                    }
                    await page.waitForTimeout(2500);
                    clicked = true;
                    break;
                  } catch {}
                }
              }

              if (!clicked) {
                const text = await page.locator('body').innerText().catch(() => '');
                console.log(text.slice(0, 5000));
                console.log(links.slice(0, 100));
                throw new Error('Could not locate a download control on firestorage share page');
              }
            }

            await browser.close();

            if (!fs.existsSync(out)) throw new Error('Download did not produce /tmp/thecloud.zip');
            const size = fs.statSync(out).size;
            if (size < 100000) throw new Error('Downloaded file is unexpectedly small: ' + size);
            console.log('Downloaded bytes:', size);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Import project into GitHub branch
        run: |
          set -euo pipefail
          unzip -t /tmp/thecloud.zip >/dev/null
          rm -rf deployments/the-cloud/public
          mkdir -p deployments/the-cloud/public
          unzip -q /tmp/thecloud.zip -d deployments/the-cloud/public

          cat > deployments/the-cloud/wrangler.jsonc <<'EOF'
          {
            "name": "the-cloud",
            "compatibility_date": "2026-09-24",
            "assets": {
              "directory": "./public"
            },
            "observability": {
              "enabled": true
            }
          }
          EOF

          cat > deployments/the-cloud/README.md <<'EOF'
          # THE CLOUD

          Static mini-app prototype v13.3.

          Production: https://thecloud.viiversion.com

          Deployment is isolated on branch `the-cloud` and published through Cloudflare Workers Static Assets.
          EOF

          test -f deployments/the-cloud/public/index.html
          test -f deployments/the-cloud/public/assets/scene-1.webp
          grep -Fq '<title>The Cloud Mini App v13</title>' deployments/the-cloud/public/index.html

          git config user.name "VIIVERSION deploy bot"
          git config user.email "actions@users.noreply.github.com"
          git add deployments/the-cloud
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Import THE CLOUD v13.3 deployment source"
            git push origin the-cloud
          fi
