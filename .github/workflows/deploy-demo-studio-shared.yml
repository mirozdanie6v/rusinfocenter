name: Deploy VIIVERSION Demo Studio via RIC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.deploy-demo-studio'

permissions:
  contents: read

concurrency:
  group: viiversion-demo-studio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEMO_STUDIO_API_KEY: ${{ secrets.DEMO_STUDIO_API_KEY }}
      TARGET_DOMAIN: demostudio.viiversion.com
      WORKER_NAME: viiversion-demo-studio

    steps:
      - name: Checkout RIC release metadata
        uses: actions/checkout@v5
        with:
          path: ric-release

      - name: Resolve pinned release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          marker="ric-release/.deploy-demo-studio"
          version=$(awk -F= '/^release=/{print $2}' "${marker}")
          source=$(awk -F= '/^source=/{print $2}' "${marker}")
          domain=$(head -n 1 "${marker}")

          test "${domain}" = "${TARGET_DOMAIN}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${source}" =~ ^[0-9a-f]{40}$ ]]

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "source=${source}" >> "${GITHUB_OUTPUT}"
          echo "Pinned Demo Studio release: ${version} @ ${source}"

      - name: Checkout pinned Demo Studio source
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/VIIVERSION_Demo_Studio
          ref: ${{ steps.release.outputs.source }}
          path: demo-studio

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify shared RIC credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo "RIC Cloudflare credentials: available"
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "RIC OpenAI key: available"
          else
            echo "RIC OpenAI key: missing"
          fi
          if [ -n "${DEMO_STUDIO_API_KEY:-}" ]; then
            echo "Demo Studio API key: available"
          else
            echo "Demo Studio API key: missing; anonymous safety quotas remain enabled"
          fi

      - name: Install and validate pinned Demo Studio
        working-directory: demo-studio
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${{ steps.release.outputs.version }}"
          expected_source="${{ steps.release.outputs.source }}"

          test "$(node -p "require('./package.json').version")" = "${expected_version}"
          test "$(git rev-parse HEAD)" = "${expected_source}"

          npm install --no-fund --no-audit
          npm run typecheck
          npm test
          docker version

          echo "Validated exact Demo Studio source ${expected_source} at version ${expected_version}."

      - name: Ensure private R2 artifact storage
        working-directory: demo-studio
        shell: bash
        run: |
          set -euo pipefail
          bucket="viiversion-demo-studio-artifacts"

          set +e
          create_output=$(npx wrangler r2 bucket create "${bucket}" 2>&1)
          create_status=$?
          set -e
          if [ "${create_status}" -ne 0 ] && ! echo "${create_output}" | grep -Eiq 'already exists|already owned'; then
            echo "${create_output}"
            exit "${create_status}"
          fi
          echo "R2 bucket ready: ${bucket}"

          if ! npx wrangler r2 bucket lifecycle list "${bucket}" 2>&1 | grep -Fq 'demo-studio-7d'; then
            npx wrangler r2 bucket lifecycle add "${bucket}" demo-studio-7d --expire-days 7 --force
          fi
          echo "R2 lifecycle ready: 7 days"

      - name: Deploy Worker and Container image
        working-directory: demo-studio
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc

      - name: Sync runtime secrets
        working-directory: demo-studio
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printf '%s' "${OPENAI_API_KEY}" | npx wrangler secret put OPENAI_API_KEY --config wrangler.jsonc
          fi
          if [ -n "${DEMO_STUDIO_API_KEY:-}" ]; then
            printf '%s' "${DEMO_STUDIO_API_KEY}" | npx wrangler secret put DEMO_STUDIO_API_KEY --config wrangler.jsonc
          fi

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          expected_version="${{ steps.release.outputs.version }}"
          ready=0

          for attempt in $(seq 1 60); do
            code=$(curl -L -sS --connect-timeout 8 --max-time 40               -o /tmp/demo-health.json -w '%{http_code}'               "${base}/health?deploy=${GITHUB_SHA}" || true)

            if [ "${code}" = "200" ] && jq -e --arg version "${expected_version}"               '(.ok == true) and (.service == "viiversion-demo-studio") and (.version == $version)'               /tmp/demo-health.json >/dev/null 2>&1; then
              ready=1
              break
            fi

            echo "Demo Studio container not ready yet (attempt ${attempt}, HTTP ${code})"
            sleep 10
          done

          test "${ready}" -eq 1
          jq '{ok,service,version}' /tmp/demo-health.json

      - name: Verify public landing page
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          code=$(curl -L -sS --connect-timeout 8 --max-time 40             -o /tmp/demo-root.html -w '%{http_code}'             "${base}/?release=${{ steps.release.outputs.version }}")

          test "${code}" = "200"
          grep -Fq 'VIIVERSION Demo Studio' /tmp/demo-root.html
          grep -Fq 'Turn web apps into polished demo videos.' /tmp/demo-root.html
          echo "Demo Studio public landing page verified."

      - name: Verify MCP initialize and tools
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          auth=()
          if [ -n "${DEMO_STUDIO_API_KEY:-}" ]; then
            auth=(-H "Authorization: Bearer ${DEMO_STUDIO_API_KEY}")
          fi

          normalize_mcp_response() {
            source_file="$1"
            target_file="$2"
            if jq -e . "${source_file}" >/dev/null 2>&1; then
              cp "${source_file}" "${target_file}"
              return
            fi
            sed -n 's/^data: //p' "${source_file}" | tail -n 1 > "${target_file}"
            jq -e . "${target_file}" >/dev/null
          }

          curl -fsS -X POST "${base}/mcp"             "${auth[@]}"             -H 'content-type: application/json'             -H 'accept: application/json, text/event-stream'             --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ric-demo-studio-deploy","version":"1"}}}'             > /tmp/demo-mcp-init.raw
          normalize_mcp_response /tmp/demo-mcp-init.raw /tmp/demo-mcp-init.json
          jq -e '.result.serverInfo.name == "viiversion-demo-studio"' /tmp/demo-mcp-init.json >/dev/null

          curl -fsS -X POST "${base}/mcp"             "${auth[@]}"             -H 'content-type: application/json'             -H 'accept: application/json, text/event-stream'             --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'             > /tmp/demo-mcp-tools.raw
          normalize_mcp_response /tmp/demo-mcp-tools.raw /tmp/demo-mcp-tools.json

          jq -e             '([.result.tools[].name] | sort) == (["audit_web_app_design","create_demo_video","create_demo_video_from_scenario","get_demo_job","inspect_web_app"] | sort)'             /tmp/demo-mcp-tools.json >/dev/null

          echo "Demo Studio MCP v0.12 production surface verified."

      - name: Verify UX Design Brain MCP
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          auth=()
          if [ -n "${DEMO_STUDIO_API_KEY:-}" ]; then
            auth=(-H "Authorization: Bearer ${DEMO_STUDIO_API_KEY}")
          fi

          curl -fsS -X POST "${base}/mcp"             "${auth[@]}"             -H 'content-type: application/json'             -H 'accept: application/json, text/event-stream'             --data '{"jsonrpc":"2.0","id":7,"method":"tools/call","params":{"name":"audit_web_app_design","arguments":{"url":"https://example.com"}}}'             > /tmp/demo-design-audit.raw

          if jq -e . /tmp/demo-design-audit.raw >/dev/null 2>&1; then
            cp /tmp/demo-design-audit.raw /tmp/demo-design-audit.json
          else
            sed -n 's/^data: //p' /tmp/demo-design-audit.raw | tail -n 1 > /tmp/demo-design-audit.json
          fi

          jq -e '
            ((.result.isError // false) == false) and
            ((.result.content[0].text | fromjson) as $audit |
              ($audit.preflight.version == "ux-preflight-v1") and
              (($audit.preflight.status == "PASS") or ($audit.preflight.status == "REVISE")) and
              ($audit.profile.version == "design-profile-v1") and
              ($audit.contract.version == "design-contract-v1"))
          ' /tmp/demo-design-audit.json >/dev/null

          echo "Demo Studio UX Design Brain production tool verified."

      - name: Verify plugin-native production generation
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          auth=()
          if [ -n "${DEMO_STUDIO_API_KEY:-}" ]; then
            auth=(-H "Authorization: Bearer ${DEMO_STUDIO_API_KEY}")
          fi

          payload='{"jsonrpc":"2.0","id":11,"method":"tools/call","params":{"name":"create_demo_video_from_scenario","arguments":{"url":"https://example.com","preset":"16:9","captions":true,"voiceover":false,"brand":"VIIVERSION","scenario":{"name":"Production check","baseUrl":"https://example.com","steps":[{"action":"goto","url":"/","label":"Open target","narration":"Open the target application."},{"action":"wait","ms":700}]}}}}'

          curl -fsS -X POST "${base}/mcp"             "${auth[@]}"             -H 'content-type: application/json'             -H 'accept: application/json, text/event-stream'             --data "${payload}" > /tmp/demo-create.raw

          if jq -e . /tmp/demo-create.raw >/dev/null 2>&1; then
            cp /tmp/demo-create.raw /tmp/demo-create.json
          else
            sed -n 's/^data: //p' /tmp/demo-create.raw | tail -n 1 > /tmp/demo-create.json
          fi

          job_id=$(jq -r '.result.content[0].text | fromjson | .job_id' /tmp/demo-create.json)
          test -n "${job_id}"
          test "${job_id}" != "null"

          completed=0
          for attempt in $(seq 1 60); do
            status_json=$(curl -fsS "${base}/v1/jobs/${job_id}" "${auth[@]}")
            status=$(echo "${status_json}" | jq -r '.status')
            echo "Generation status: ${status}"

            if [ "${status}" = "completed" ]; then
              completed=1
              break
            fi

            if [ "${status}" = "failed" ]; then
              echo "${status_json}" | jq .
              exit 1
            fi

            sleep 10
          done

          test "${completed}" -eq 1

          persisted_status=$(curl -fsS "${base}/v1/jobs/${job_id}" "${auth[@]}")
          echo "${persisted_status}" | jq -e '
            (.status == "completed") and
            (.artifactReady == true) and
            (has("request") | not) and
            (has("artifactPath") | not) and
            (has("scenarioPath") | not)
          ' >/dev/null

          code=$(curl -sS -o /tmp/demo-production.mp4 -w '%{http_code}'             "${base}/v1/jobs/${job_id}/artifact" "${auth[@]}")

          test "${code}" = "200"
          test "$(stat -c%s /tmp/demo-production.mp4)" -gt 10000
          file /tmp/demo-production.mp4
          echo "Durable R2 status and artifact verified."

      - name: Record released source
        shell: bash
        run: |
          set -euo pipefail
          echo "Released Demo Studio ${{ steps.release.outputs.version }}"
          echo "Source SHA: ${{ steps.release.outputs.source }}"
