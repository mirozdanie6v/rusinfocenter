name: Restore MAX TOUR full stable assets exactly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.restore-maxtour-full-assets-exact'

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: https://maxtourvietnam.viiversion.com
      SERVICE: maxtourvietnam
      STABLE_VERSION: 42705a9d-5c00-4841-b99b-45ddda3422f1
    steps:
      - name: Restore exact known-good Worker version
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest rollback "$STABLE_VERSION" --name "$SERVICE" --message "Restore known-good MAX TOUR full static asset bundle"

      - name: Verify full live image set
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            if curl -L -fsS --connect-timeout 5 --max-time 20 "${TARGET}/?restore=${GITHUB_SHA}-${attempt}" -o /tmp/home.html; then
              if grep -q 'id="root"' /tmp/home.html; then ok=1; break; fi
            fi
            sleep 2
          done
          test "$ok" -eq 1

          curl -L -fsS "${TARGET}/api/health?restore=${GITHUB_SHA}" -o /tmp/health.json
          jq -e '.ok == true and .project == "maxtourvietnam"' /tmp/health.json >/dev/null
          curl -L -fsS "${TARGET}/api/tours?restore=${GITHUB_SHA}" -o /tmp/tours.json
          jq -e '.tours | length == 28' /tmp/tours.json >/dev/null

          check_image() {
            local path="$1"
            local out="/tmp/img-$(echo "$path" | tr '/.' '__')"
            curl -L -fsS -D /tmp/headers "${TARGET}${path}?restore=${GITHUB_SHA}" -o "$out"
            grep -qi '^content-type: image/' /tmp/headers || grep -qi '^content-type:.*svg' /tmp/headers
            test "$(wc -c < "$out")" -gt 1000
            printf 'OK %s %s bytes\n' "$path" "$(wc -c < "$out")"
          }

          for path in \
            /mirror-media/370dd828995262c5f6.jpg \
            /mirror-media/00413657b7f65d00ba.png \
            /mirror-media/361ac068da624260ee.png \
            /mirror-media/1c73f0747a82e1f65e.png \
            /mirror-media/18420369e936c62fb0.jpg \
            /mirror-media/b61ebe9d9d537cde4c.png \
            /mirror-media/642f704088af4e3d48.png \
            /mirror-media/789cbd1e52fbe2bb96.png \
            /mirror-media/dbdd4c7c7a1a8b401d.png \
            /mirror-media/0f2183c05583ed5181.jpg \
            /mirror-media/ce6ad3ce78adc4fb82.png \
            /mirror-media/31704dd18a60706436.png \
            /mirror-media/e7e97b7767ad71ce9c.png \
            /mirror-media/4428f3e199f4015673.png \
            /mirror-media/cee24f1bf577f715f9.png \
            /mirror-media/7892b857d3c77fe48a.png \
            /mirror-media/9191aea8c66c333146.png \
            /mirror-media/719a9ef6660e04585b.png \
            /mirror-media/2bbe269bda916251f8.png \
            /mirror-media/8884a36ff2782b39ad.png \
            /mirror-media/a22a64d26795b243be.png \
            /mirror-media/41a8eaf3295d53b2f3.png \
            /mirror-media/979b9b42c26fa733e0.png; do
            check_image "$path"
          done

          echo 'RESTORE PASS: full stable image bundle is live.'
