name: Inspect RIC navigation source

on:
  push:
    paths:
      - .github/workflows/inspect-nav-source.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Inspect exact bottom navigation markup and CSS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundles /tmp/ric-src
          gh release download source-v32 --repo "${{ github.repository }}" --pattern 'source.tar.gz' --dir bundles
          tar -xzf bundles/source.tar.gz -C /tmp/ric-src
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = Path('/tmp/ric-src/src/generated/pages.ts').read_text(encoding='utf-8')
          css = Path('/tmp/ric-src/src/styles.css').read_text(encoding='utf-8')

          print('=== BOTTOM NAV MARKUP SAMPLES ===')
          keys = ['mobile-bar','mobile-link','bottom-nav','bottomNav','nav-label','mobile-nav','tabbar','tab-bar','bottom-bar']
          seen = set()
          for key in keys:
              for m in list(re.finditer(re.escape(key), pages))[:3]:
                  p = m.start()
                  sample = repr(pages[max(0,p-350):p+650])
                  if sample not in seen:
                      seen.add(sample)
                      print(f'KEY={key}: {sample}')

          print('=== CSS LINES AROUND BOTTOM/MOBILE/NAV SELECTORS ===')
          lines = css.splitlines()
          for i,line in enumerate(lines):
              low=line.lower()
              if any(k in low for k in ['mobile-bar','mobile-link','bottom-nav','nav-label','bottom-bar','tabbar','tab-bar']):
                  start=max(0,i-2); end=min(len(lines),i+14)
                  print(f'--- lines {start+1}-{end} ---')
                  print('\n'.join(lines[start:end]))
          PY
