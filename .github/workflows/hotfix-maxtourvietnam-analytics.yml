name: Hotfix maxtourvietnam Telegram analytics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.deploy-maxtourvietnam-analytics'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: 56fa9423ef85e05559f453af43ec400f
      TARGET_DOMAIN: maxtourvietnam.viiversion.com
      ORIGIN_WORKER: maxtourvietnam
      PROXY_WORKER: maxtourvietnam-analytics-proxy

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Create analytics proxy with service binding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/maxtour-analytics-proxy
          cat > /tmp/maxtour-analytics-proxy/worker.js <<'EOF'
          export default {
            async fetch(request, env) {
              const response = await env.ORIGIN.fetch(request);
              const contentType = response.headers.get('content-type') || '';
              if (!contentType.includes('text/html')) return response;

              let html = await response.text();
              if (!html.includes('telegram.org/js/telegram-web-app.js')) {
                html = html.replace('</head>', '<script src="https://telegram.org/js/telegram-web-app.js?63"></script></head>');
              }
              if (!html.includes('dashboard.viiversion.com/tracker.js')) {
                html = html.replace('</body>', '<script defer src="https://dashboard.viiversion.com/tracker.js" data-project="MAX TOUR Vietnam"></script></body>');
              }
              const headers = new Headers(response.headers);
              headers.delete('content-length');
              headers.set('cache-control', 'no-store');
              return new Response(html, { status: response.status, statusText: response.statusText, headers });
            }
          };
          EOF
          cat > /tmp/maxtour-analytics-proxy/wrangler.jsonc <<EOF
          {
            "name": "${PROXY_WORKER}",
            "main": "worker.js",
            "compatibility_date": "2026-09-23",
            "services": [
              {
                "binding": "ORIGIN",
                "service": "${ORIGIN_WORKER}"
              }
            ]
          }
          EOF

      - name: Deploy analytics proxy
        working-directory: /tmp/maxtour-analytics-proxy
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify proxy before switching domain
        shell: bash
        run: |
          set -euo pipefail
          proxy="https://${PROXY_WORKER}.viiversion.workers.dev"
          curl -L -fsS "$proxy/?prebind=${GITHUB_SHA}" -o /tmp/proxy-home.html
          grep -Fq 'dashboard.viiversion.com/tracker.js' /tmp/proxy-home.html
          grep -Fq 'telegram.org/js/telegram-web-app.js?63' /tmp/proxy-home.html
          curl -L -fsS "$proxy/api/health?prebind=${GITHUB_SHA}" -o /tmp/proxy-health.json
          jq -e '.ok == true and .project == "maxtourvietnam"' /tmp/proxy-health.json >/dev/null

      - name: Switch production custom domain with rollback
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          list=$(curl -fsS "$api" "${auth[@]}")
          domain_id=$(echo "$list" | jq -r --arg h "$TARGET_DOMAIN" '.result[] | select(.hostname == $h) | .id' | head -n1)
          old_service=$(echo "$list" | jq -r --arg h "$TARGET_DOMAIN" '.result[] | select(.hostname == $h) | .service' | head -n1)
          test -n "$domain_id" && test "$domain_id" != "null"
          test -n "$old_service" && test "$old_service" != "null"

          curl -fsS -X DELETE "$api/$domain_id" "${auth[@]}" >/tmp/delete-domain.json
          sleep 2

          set +e
          response=$(curl -sS "$api" -X PUT "${auth[@]}" --data "{\"hostname\":\"${TARGET_DOMAIN}\",\"service\":\"${PROXY_WORKER}\",\"zone_id\":\"${CF_ZONE_ID}\",\"zone_name\":\"viiversion.com\"}")
          success=$(echo "$response" | jq -r '.success // false')
          set -e

          if [ "$success" != "true" ]; then
            echo "::error::Proxy domain bind failed; restoring $old_service"
            echo "$response"
            restore=$(curl -sS "$api" -X PUT "${auth[@]}" --data "{\"hostname\":\"${TARGET_DOMAIN}\",\"service\":\"${old_service}\",\"zone_id\":\"${CF_ZONE_ID}\",\"zone_name\":\"viiversion.com\"}")
            test "$(echo "$restore" | jq -r '.success')" = "true"
            exit 1
          fi
          test "$(echo "$response" | jq -r '.result.service')" = "$PROXY_WORKER"

      - name: Verify production content and API are unchanged plus analytics
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          ready=0
          for attempt in $(seq 1 20); do
            curl -L -fsS --connect-timeout 5 --max-time 20 "$base/?analytics_proxy=${GITHUB_SHA}-$attempt" -o /tmp/home.html || true
            if grep -Fq 'dashboard.viiversion.com/tracker.js' /tmp/home.html && grep -Fq 'telegram.org/js/telegram-web-app.js?63' /tmp/home.html; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" -eq 1
          curl -L -fsS "$base/api/health?analytics_proxy=${GITHUB_SHA}" -o /tmp/health.json
          jq -e '.ok == true and .project == "maxtourvietnam"' /tmp/health.json >/dev/null
          curl -L -fsS "$base/api/tours?analytics_proxy=${GITHUB_SHA}" -o /tmp/tours.json
          jq -e '.tours | length == 28' /tmp/tours.json >/dev/null
          echo 'MAX TOUR Vietnam is proxied to the existing production Worker with Telegram analytics injected.'
