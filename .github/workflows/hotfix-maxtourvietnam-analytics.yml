name: Hotfix maxtourvietnam Telegram analytics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.deploy-maxtourvietnam-analytics'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_DOMAIN: maxtourvietnam.viiversion.com
      WORKER_NAME: maxtourvietnam
      DB_NAME: maxtourvietnam

    steps:
      - name: Checkout maxtourvietnam source
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/maxtourvietnam
          ref: main
          path: maxtourvietnam

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install deployment dependencies
        working-directory: maxtourvietnam
        run: npm install --no-audit --no-fund

      - name: Mirror current production static bundle
        working-directory: maxtourvietnam
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { dirname } from 'node:path';

          const base = 'https://maxtourvietnam.viiversion.com';
          const queue = ['/', '/tour-main/manifest.json'];
          const seen = new Set();

          const enqueue = (path) => {
            if (!path || !path.startsWith('/')) return;
            if (!/^\/(?:assets|mirror-media|tour-galleries|tour-main)\//.test(path)) return;
            const clean = path.replace(/[?#].*$/, '');
            if (!seen.has(clean)) queue.push(clean);
          };

          while (queue.length) {
            const path = queue.shift();
            const clean = path.replace(/[?#].*$/, '');
            if (seen.has(clean)) continue;
            seen.add(clean);
            const response = await fetch(`${base}${path}?analytics_hotfix=20260923`, { redirect: 'follow' });
            if (!response.ok) throw new Error(`Mirror fetch failed ${response.status}: ${path}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            const out = clean === '/' ? 'dist/index.html' : `dist${clean}`;
            await mkdir(dirname(out), { recursive: true });
            await writeFile(out, bytes);
            const type = response.headers.get('content-type') || '';
            const textual = /text|javascript|json|svg|xml/.test(type) || /\.(?:html|js|css|json|svg)$/.test(clean);
            if (textual) {
              const text = bytes.toString('utf8');
              for (const match of text.matchAll(/\/(?:assets|mirror-media|tour-galleries|tour-main)\/[^"'()<>s\\]+/g)) enqueue(match[0]);
              if (clean === '/tour-main/manifest.json') {
                const manifest = JSON.parse(text);
                for (const slug of Object.keys(manifest)) enqueue(`/tour-main/${slug}.html`);
              }
            }
          }
          console.log(`Mirrored ${seen.size} production resources.`);
          NODE
          test -s dist/index.html

      - name: Inject Telegram analytics only
        working-directory: maxtourvietnam
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'dist/index.html';
          let html = await readFile(path, 'utf8');
          if (!html.includes('telegram.org/js/telegram-web-app.js')) {
            html = html.replace('</head>', '<script src="https://telegram.org/js/telegram-web-app.js?63"></script></head>');
          }
          if (!html.includes('dashboard.viiversion.com/tracker.js')) {
            html = html.replace('</body>', '<script defer src="https://dashboard.viiversion.com/tracker.js" data-project="MAX TOUR Vietnam"></script></body>');
          }
          await writeFile(path, html, 'utf8');
          NODE
          grep -Fq 'telegram.org/js/telegram-web-app.js?63' dist/index.html
          grep -Fq 'dashboard.viiversion.com/tracker.js' dist/index.html
          grep -Fq 'data-project="MAX TOUR Vietnam"' dist/index.html

      - name: Prepare existing D1 binding
        working-directory: maxtourvietnam
        shell: bash
        run: |
          set -euo pipefail
          DB_ID="$(npx wrangler d1 list --json | jq -r --arg name "$DB_NAME" '.[] | select(.name == $name) | (.uuid // .id)' | head -n 1)"
          test -n "$DB_ID" && test "$DB_ID" != "null"
          jq --arg id "$DB_ID" --arg worker "$WORKER_NAME" '.name = $worker | .d1_databases[0].database_id = $id' wrangler.jsonc > wrangler.analytics-hotfix.jsonc

      - name: Deploy unchanged production bundle with analytics
        working-directory: maxtourvietnam
        run: npx wrangler deploy --config wrangler.analytics-hotfix.jsonc

      - name: Verify production analytics and API
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          ready=0
          for attempt in $(seq 1 20); do
            curl -L -fsS --connect-timeout 5 --max-time 20 "$base/?analytics_hotfix=${GITHUB_SHA}-$attempt" -o /tmp/home.html || true
            if grep -Fq 'dashboard.viiversion.com/tracker.js' /tmp/home.html && grep -Fq 'telegram.org/js/telegram-web-app.js?63' /tmp/home.html; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" -eq 1
          curl -L -fsS "$base/api/health?analytics_hotfix=${GITHUB_SHA}" -o /tmp/health.json
          jq -e '.ok == true and .project == "maxtourvietnam"' /tmp/health.json >/dev/null
          curl -L -fsS "$base/api/tours?analytics_hotfix=${GITHUB_SHA}" -o /tmp/tours.json
          jq -e '.tours | length == 28' /tmp/tours.json >/dev/null
          echo 'MAX TOUR Vietnam Telegram analytics hotfix is live.'
