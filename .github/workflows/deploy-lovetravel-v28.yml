name: Deploy LoveTravel from MAX TOUR production

on:
  push:
    branches: [deploy-lovetravel-v28]
    paths:
      - '.deploy-lovetravel-v28'
      - '.github/workflows/deploy-lovetravel-v28.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lovetravel-v28-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VIIVERSION_ZONE_ID: 56fa9423ef85e05559f453af43ec400f
      MAX_TOUR_SOURCE_SHA: cacaf79f8714f6cddad6d8d3085593952c070d0e
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v5

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }

      - name: Fetch exact MAX TOUR production source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/mirozdanie6v/MAX-TOUR.git maxtour
          cd maxtour
          git checkout "${MAX_TOUR_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${MAX_TOUR_SOURCE_SHA}"
          test -f standalone-v28/src/hero-redesign.js
          test -f standalone-v28/src/i18n-ko-v1.js
          test -f standalone-v28/src/ai-booking-bridge-v25.js

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install, test and build exact standalone v28
        working-directory: maxtour/standalone-v28
        run: |
          npm install
          npm test
          npm run build

      - name: Prepare bootstrap Wrangler config
        working-directory: maxtour/standalone-v28
        shell: bash
        run: |
          cat > wrangler.bootstrap.json <<'JSON'
          {
            "name": "love-travel-v28-bootstrap",
            "compatibility_date": "2026-09-09"
          }
          JSON

      - name: Resolve isolated LoveTravel v28 D1
        working-directory: maxtour/standalone-v28
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler d1 info love-travel-v28-db --json --config wrangler.bootstrap.json > /tmp/love-v28-d1.json 2>/dev/null; then
            echo 'Using existing LoveTravel v28 D1.'
          else
            npx wrangler d1 create love-travel-v28-db --location apac --config wrangler.bootstrap.json
            npx wrangler d1 info love-travel-v28-db --json --config wrangler.bootstrap.json > /tmp/love-v28-d1.json
          fi
          db_id=$(jq -r '.uuid // .database_id // .id // empty' /tmp/love-v28-d1.json)
          test -n "$db_id"
          echo "LOVE_V28_D1_ID=$db_id" >> "$GITHUB_ENV"

      - name: Resolve isolated LoveTravel v28 R2
        working-directory: maxtour/standalone-v28
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket create love-travel-v28-media --config wrangler.bootstrap.json > /tmp/r2-create.log 2>&1; then
            cat /tmp/r2-create.log
          else
            cat /tmp/r2-create.log
            if grep -Eqi 'already exists|bucket.*exists' /tmp/r2-create.log; then
              echo 'Using existing LoveTravel v28 R2 bucket.'
            else
              exit 1
            fi
          fi

      - name: Generate LoveTravel v28 Wrangler config
        working-directory: maxtour/standalone-v28
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          cfg.name = 'love-travel-v28';
          cfg.vars = {
            ...cfg.vars,
            APP_ENV: 'love-travel-v28',
            APP_URL: 'https://lovetravel.viiversion.com'
          };
          cfg.d1_databases = [{
            binding: 'DB',
            database_name: 'love-travel-v28-db',
            database_id: process.env.LOVE_V28_D1_ID
          }];
          cfg.r2_buckets = [{
            binding: 'TOUR_MEDIA',
            bucket_name: 'love-travel-v28-media',
            preview_bucket_name: 'love-travel-v28-media'
          }];
          fs.writeFileSync('wrangler.lovetravel.json', JSON.stringify(cfg, null, 2));
          NODE
          jq . wrangler.lovetravel.json

      - name: Apply standalone v28 migrations
        working-directory: maxtour/standalone-v28
        run: npx wrangler d1 migrations apply love-travel-v28-db --remote --config wrangler.lovetravel.json

      - name: Deploy exact MAX TOUR production build as LoveTravel
        working-directory: maxtour/standalone-v28
        run: npx wrangler deploy --config wrangler.lovetravel.json

      - name: Attach LoveTravel custom domain
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"             -X PUT             -H 'Content-Type: application/json'             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             --data "{\"hostname\":\"lovetravel.viiversion.com\",\"service\":\"love-travel-v28\",\"zone_id\":\"${VIIVERSION_ZONE_ID}\",\"zone_name\":\"viiversion.com\"}")
          echo "$response" | jq .
          test "$(echo "$response" | jq -r '.success')" = "true"
          test "$(echo "$response" | jq -r '.result.hostname')" = "lovetravel.viiversion.com"
          test "$(echo "$response" | jq -r '.result.service')" = "love-travel-v28"

      - name: Verify LoveTravel matches live MAX TOUR production assets
        shell: bash
        run: |
          set -euo pipefail
          love='https://lovetravel.viiversion.com'
          max='https://max-tour.viiversion.com'
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/love-home.html -w '%{http_code}' "$love/" || true)
            if [ "$code" = "200" ] && grep -Fq '/hero-redesign.js' /tmp/love-home.html && grep -Fq '/i18n-ko-v1.js' /tmp/love-home.html; then
              break
            fi
            sleep 5
          done
          grep -Fq '/ai-booking-bridge-v25.js' /tmp/love-home.html
          for asset in hero-redesign.js production-embed-polish.css i18n-ko-v1.js ai-booking-bridge-v25.js tour-lightbox.js; do
            curl -L -fsS "$max/$asset" -o "/tmp/max-$asset"
            curl -L -fsS "$love/$asset" -o "/tmp/love-$asset"
            max_sha=$(sha256sum "/tmp/max-$asset" | awk '{print $1}')
            love_sha=$(sha256sum "/tmp/love-$asset" | awk '{print $1}')
            echo "$asset MAX=$max_sha LOVE=$love_sha"
            test "$max_sha" = "$love_sha"
          done
          echo 'LoveTravel static production assets match live MAX TOUR.'

      - name: Verify LoveTravel main screens
        shell: bash
        run: |
          set -euo pipefail
          base='https://lovetravel.viiversion.com'
          curl -L -fsS "$base/" -o /tmp/home.html
          curl -L -fsS "$base/admin/" -o /tmp/admin.html
          curl -L -fsS "$base/director/" -o /tmp/director.html
          grep -Fq 'MaxTour Mini App Prototype v28' /tmp/home.html
          grep -Fq 'production-embed-polish.css' /tmp/home.html
          test -s /tmp/admin.html
          test -s /tmp/director.html
          echo 'LoveTravel v28 production smoke passed.'
