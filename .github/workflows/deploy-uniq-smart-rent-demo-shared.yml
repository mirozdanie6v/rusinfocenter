name: Deploy UNIQ Smart Rent demo via VIIVERSION

on:
  push:
    branches:
      - main
    paths:
      - '.deploy-uniq-smart-rent-demo'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VIIVERSION_ZONE_ID: 56fa9423ef85e05559f453af43ec400f
      DEMO_DB_NAME: uniq-smart-rent-demo-db
      DEMO_SERVICE: uniq-smart-rent-demo
      DEMO_HOSTNAME: uniq-smart-rent-demo.viiversion.com

    steps:
      - name: Checkout UNIQ Smart Rent demo branch
        uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/uniq-smart-rent
          ref: refactor/react-typescript-vite-demo
          path: uniq-smart-rent

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install, validate and build
        working-directory: uniq-smart-rent
        run: |
          set -euo pipefail
          npm install
          npm run check

      - name: Resolve isolated demo D1 in VIIVERSION account
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          list=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" "${auth[@]}")
          test "$(echo "$list" | jq -r '.success')" = "true"
          db_id=$(echo "$list" | jq -r --arg name "$DEMO_DB_NAME" '.result[] | select(.name == $name) | .uuid' | head -n1)
          if [ -z "$db_id" ] || [ "$db_id" = "null" ]; then
            created=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" -X POST "${auth[@]}" --data "{\"name\":\"${DEMO_DB_NAME}\"}")
            test "$(echo "$created" | jq -r '.success')" = "true"
            db_id=$(echo "$created" | jq -r '.result.uuid')
          fi
          test -n "$db_id"
          test "$db_id" != "null"
          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"

      - name: Prepare account-specific demo Wrangler config
        working-directory: uniq-smart-rent
        env:
          UNIQ_DEMO_D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.demo.jsonc', 'utf8'));
          if (!Array.isArray(cfg.d1_databases) || !cfg.d1_databases[0]) throw new Error('D1 binding missing');
          cfg.name = process.env.DEMO_SERVICE;
          cfg.d1_databases[0].database_name = process.env.DEMO_DB_NAME;
          cfg.d1_databases[0].database_id = process.env.UNIQ_DEMO_D1_DATABASE_ID;
          cfg.vars = { ...(cfg.vars || {}), DEMO_MODE: 'true' };
          delete cfg.routes;
          fs.writeFileSync('wrangler.viiversion-demo.jsonc', JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - name: Apply demo D1 migrations
        working-directory: uniq-smart-rent
        run: npx wrangler d1 migrations apply "$DEMO_DB_NAME" --remote --config wrangler.viiversion-demo.jsonc

      - name: Deploy isolated demo Worker and assets
        working-directory: uniq-smart-rent
        run: npx wrangler deploy --config wrangler.viiversion-demo.jsonc

      - name: Attach demo custom domain
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -X PUT \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data "{\"hostname\":\"${DEMO_HOSTNAME}\",\"service\":\"${DEMO_SERVICE}\",\"zone_id\":\"${VIIVERSION_ZONE_ID}\",\"zone_name\":\"viiversion.com\"}")
          test "$(echo "$response" | jq -r '.success')" = "true"
          test "$(echo "$response" | jq -r '.result.hostname')" = "$DEMO_HOSTNAME"
          test "$(echo "$response" | jq -r '.result.service')" = "$DEMO_SERVICE"

      - name: Verify live demo
        shell: bash
        run: |
          set -euo pipefail
          base="https://${DEMO_HOSTNAME}"
          ok=0
          for attempt in $(seq 1 24); do
            home_code=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/uniq-demo-home.html -w '%{http_code}' "$base/?deploy=${GITHUB_SHA}" || true)
            health_code=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/uniq-demo-health.json -w '%{http_code}' "$base/api/health?deploy=${GITHUB_SHA}" || true)
            if [ "$home_code" = "200" ] && [ "$health_code" = "200" ]; then
              echo "Verified live $base"
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
