name: Deploy merged UNIQ Stage 12 with Analytics

on:
  push:
    branches:
      - ops/deploy-uniq-smart-rent-copy
    paths:
      - '.github/workflows/deploy-uniq-stage12-merged.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: mirozdanie6v/uniq-smart-rent
          ref: refactor/react-typescript-vite-demo
          path: uniq-smart-rent
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify merged build
        working-directory: uniq-smart-rent
        run: |
          npm install
          npm run check
      - name: Prepare Cloudflare config
        working-directory: uniq-smart-rent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          list=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=uniq-smart-rent-db&per_page=100" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          db_id=$(echo "$list" | jq -r '.result[0].uuid // empty')
          test -n "$db_id"
          cat > wrangler-merged.jsonc <<EOF
          {
            "name":"uniq-smart-rent",
            "main":"src/worker.ts",
            "compatibility_date":"2026-08-25",
            "workers_dev":true,
            "assets":{"directory":"./dist","binding":"ASSETS","not_found_handling":"single-page-application","run_worker_first":["/api/*"]},
            "d1_databases":[{"binding":"DB","database_name":"uniq-smart-rent-db","database_id":"${db_id}","migrations_dir":"migrations"}],
            "vars":{"DEMO_MODE":"true"},
            "observability":{"enabled":true}
          }
          EOF
      - name: Apply migrations
        working-directory: uniq-smart-rent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply uniq-smart-rent-db --remote --config wrangler-merged.jsonc
      - name: Verify Stage 12 operational data
        working-directory: uniq-smart-rent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fleet=$(npx wrangler d1 execute uniq-smart-rent-db --remote --config wrangler-merged.jsonc --json --command "SELECT COUNT(*) AS c FROM vehicles;")
          test "$(echo "$fleet" | jq -r '.[0].results[0].c // 0')" -ge 89
      - name: Deploy merged Worker
        working-directory: uniq-smart-rent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler-merged.jsonc
      - name: Attach production domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" -X PUT -H 'Content-Type: application/json' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --data '{"hostname":"uniq-smart-rent.viiversion.com","service":"uniq-smart-rent","zone_id":"56fa9423ef85e05559f453af43ec400f","zone_name":"viiversion.com"}')
          test "$(echo "$response" | jq -r '.success')" = "true"
      - name: Production regression gate
        run: |
          set -euo pipefail
          base='https://uniq-smart-rent.viiversion.com'
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 15 -o /tmp/home.html -w '%{http_code}' "$base/" || true)
            asset=$(grep -oE 'src="[^"]*assets/index-[^"]+\.js"' /tmp/home.html | head -1 | cut -d'"' -f2 || true)
            css=$(grep -oE 'href="[^"]*assets/index-[^"]+\.css"' /tmp/home.html | head -1 | cut -d'"' -f2 || true)
            if [ "$code" = "200" ] && [ -n "$asset" ] && [ -n "$css" ]; then
              curl -fsSL "$base$asset" -o /tmp/app.js
              curl -fsSL "$base$css" -o /tmp/app.css
              health=$(curl -fsSL "$base/api/health" || true)
              analytics=$(curl -fsSL -H 'x-uniq-demo-role: owner' "$base/api/owner/analytics?period=7d&branch=all" || true)
              if grep -q 'Аналитика' /tmp/app.js && grep -q 'Что приносит деньги' /tmp/app.js && grep -q 'Доплатить остаток' /tmp/app.js && grep -q 'Продлить аренду' /tmp/app.js && grep -q 'Добавить филиал' /tmp/app.js && grep -q 'grid-template-columns:repeat(5,minmax(0,1fr))' /tmp/app.css; then
                test "$(echo "$health" | jq -r '.schemaVersion')" = "12"
                test "$(echo "$health" | jq -r '.ownerAnalytics')" = "true"
                test "$(echo "$health" | jq -r '.dynamicBranches')" = "true"
                test "$(echo "$health" | jq -r '.clientBookingExtension')" = "true"
                test "$(echo "$health" | jq -r '.balancePayments')" = "true"
                test "$(echo "$health" | jq -r '.overpaymentProtection')" = "true"
                test "$(echo "$health" | jq -r '.fullOperationalFleet')" = "true"
                test "$(echo "$analytics" | jq -r '.persisted')" = "true"
                test "$(echo "$analytics" | jq -r '.funnel | length')" -eq 5
                echo 'Production regression passed: Analytics + Stage 12 operations'
                ok=1
                break
              fi
            fi
            echo "Waiting for merged production version, attempt $i"
            sleep 5
          done
          test "$ok" -eq 1
