name: Seed Demo Studio Premium Voice Reference

on:
  push:
    branches:
      - vii-125-demo-studio-voice-seed
    paths:
      - '.github/workflows/seed-demo-studio-voice-reference.yml'

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_URL: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-0384-81fa-80b6-d5f5ae9a288b/raw?se=2026-10-06T18%3A12%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=e3eade2f-c50f-5de5-bb22-d58ee584801e&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T04%3A58%3A45Z&ske=2026-10-07T04%3A58%3A45Z&sks=b&skv=2026-02-06&sig=FF0vh0f6iaLxf%2B7XuiklOo6QQFOtsW8s5IGdJRtIReE%3D'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify RIC Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Download approved source artifact
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 10 --max-time 180 \
            "${SOURCE_URL}" -o /tmp/max-tour-v9.zip
          unzip -q /tmp/max-tour-v9.zip voiceover_ru.wav -d /tmp/reference
          test -s /tmp/reference/voiceover_ru.wav

      - name: Prepare canonical Niki reference
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -y -hide_banner -loglevel error \
            -i /tmp/reference/voiceover_ru.wav \
            -t 8.8 \
            -af "highpass=f=70,lowpass=f=11500,loudnorm=I=-17:TP=-2:LRA=8" \
            -ar 24000 -ac 1 /tmp/niki-reference.wav
          actual=$(sha256sum /tmp/niki-reference.wav | awk '{print $1}')
          echo "NIKI_REFERENCE_SHA256=${actual}" >> "${GITHUB_ENV}"
          echo "Prepared Niki reference: ${actual}"

      - name: Seed R2 through ephemeral Worker binding
        shell: bash
        run: |
          set -euo pipefail

          seed_worker="demo-studio-r2-seed-${GITHUB_RUN_ID}"
          seed_token=$(openssl rand -hex 24)

          cat > /tmp/seed-worker.js <<'JS'
          export default {
            async fetch(request, env) {
              if (request.headers.get("x-seed-token") !== env.SEED_TOKEN) {
                return new Response("Unauthorized", { status: 401 });
              }

              const key = "voice-references/niki-reference.wav";
              if (request.method === "PUT") {
                const body = await request.arrayBuffer();
                if (body.byteLength < 10000) {
                  return new Response("Reference too small", { status: 400 });
                }
                await env.BUCKET.put(key, body, {
                  httpMetadata: {
                    contentType: "audio/wav",
                    cacheControl: "private, max-age=31536000, immutable",
                  },
                });
                return Response.json({ ok: true, bytes: body.byteLength });
              }

              if (request.method === "GET") {
                const object = await env.BUCKET.get(key);
                if (!object) return new Response("Not found", { status: 404 });
                return new Response(object.body, {
                  headers: {
                    "content-type": "audio/wav",
                    "content-length": String(object.size),
                    "cache-control": "no-store",
                  },
                });
              }

              return new Response("Method not allowed", { status: 405 });
            },
          };
          JS

          cat > /tmp/wrangler-seed.jsonc <<EOF
          {
            "name": "${seed_worker}",
            "main": "/tmp/seed-worker.js",
            "compatibility_date": "2026-10-01",
            "workers_dev": true,
            "vars": {
              "SEED_TOKEN": "${seed_token}"
            },
            "r2_buckets": [
              {
                "binding": "BUCKET",
                "bucket_name": "viiversion-demo-studio-artifacts"
              }
            ]
          }
          EOF

          cleanup() {
            npx wrangler@4 delete "${seed_worker}" --force >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx wrangler@4 deploy --config /tmp/wrangler-seed.jsonc 2>&1 | tee /tmp/seed-deploy.log
          seed_url=$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/seed-deploy.log | tail -n 1)
          test -n "${seed_url}"

          curl -fsS -X PUT "${seed_url}" \
            -H "x-seed-token: ${seed_token}" \
            -H "content-type: audio/wav" \
            --data-binary @/tmp/niki-reference.wav \
            > /tmp/seed-result.json
          jq -e '.ok == true and .bytes > 10000' /tmp/seed-result.json >/dev/null

          curl -fsS "${seed_url}" \
            -H "x-seed-token: ${seed_token}" \
            -o /tmp/niki-reference-check.wav

          actual=$(sha256sum /tmp/niki-reference-check.wav | awk '{print $1}')
          test "${actual}" = "${NIKI_REFERENCE_SHA256}"
          echo "NIKI_REFERENCE_R2=verified"
          echo "NIKI_REFERENCE_SHA256=${actual}"
